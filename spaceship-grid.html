<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spaceship Grid – Visual Prototype</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #06060e;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  min-height: 100vh;
  font-family: 'Courier New', monospace;
  color: #8899aa;
  padding: 20px 0 30px;
  user-select: none;
}
h1 {
  font-size: 13px;
  letter-spacing: 4px;
  color: #334455;
  text-transform: uppercase;
  margin-bottom: 10px;
}
#wrap {
  position: relative;
  display: inline-block;
  margin: 6px 0;
}
canvas {
  display: block;
  cursor: crosshair;
}
.controls {
  display: flex;
  gap: 8px;
  margin-top: 10px;
  flex-wrap: wrap;
  justify-content: center;
}
button {
  background: #0d0d1a;
  color: #667788;
  border: 1px solid #1e2a3a;
  padding: 6px 14px;
  font-family: 'Courier New', monospace;
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
  cursor: pointer;
  transition: border-color .15s, color .15s;
}
button:hover { border-color: #3a6a8a; color: #aaccdd; }
#info {
  margin-top: 10px;
  font-size: 11px;
  letter-spacing: 2px;
  color: #2a4455;
  text-align: center;
  line-height: 1.8;
}
#archetypes {
  display: flex;
  gap: 20px;
  margin-top: 8px;
  font-size: 11px;
  letter-spacing: 2px;
}
.arch-label { text-align: center; }
.arch-label span { display: block; }
.arch-label .name { font-size: 13px; letter-spacing: 3px; }
#enemy-arch .name { color: #cc4444; }
#player-arch .name { color: #44aacc; }
</style>
</head>
<body>
<h1>Spaceship Grid · Visual Prototype</h1>
<div id="wrap"><canvas id="canvas"></canvas></div>
<div class="controls">
  <button onclick="randomizePlayer()">⟳ Randomize Player</button>
  <button onclick="randomizeEnemy()">⟳ Randomize Enemy</button>
  <button onclick="clearPlayer()">✕ Clear Player</button>
  <button onclick="clearAll()">✕ Clear All</button>
</div>
<div id="archetypes">
  <div class="arch-label" id="enemy-arch">
    <span class="name" id="enemy-arch-name">–</span>
    <span style="color:#334455">ENEMY</span>
  </div>
  <div class="arch-label" id="player-arch">
    <span class="name" id="player-arch-name">–</span>
    <span style="color:#334455">PLAYER</span>
  </div>
</div>
<div id="info">
  Click bottom half to place/remove troops · hex silhouette updates live<br>
  Colored modules fill interior hexes · 11 × 11 hex grid (5 rows per side + center row)
</div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// HEX GRID CONSTANTS
// ─────────────────────────────────────────────────────────────────────────────
// Pointy-top hexagons, odd-r offset (odd rows shift right by HW/2).
// GC=11 columns (0-10), GR=11 rows (0-10), HALF=5 = center/divider row.
// Center column = 5  →  mirror of col c = 10 - c.
// Player: rows 6-10 (depth = row - 6,  nose = row 6)
// Enemy:  rows 0-4  (depth = 4 - row,  nose = row 4)
// Row 5 = neutral center row — neither side uses it.
// ─────────────────────────────────────────────────────────────────────────────
const GC   = 11;
const GR   = 11;
const HALF = 5;
const S    = 26;                          // hex circumradius (px)
const HW   = S * Math.sqrt(3);           // horizontal center-to-center spacing
const VH   = S * 1.5;                    // vertical   center-to-center spacing
const OX   = HW / 2 + 4;               // x of col-0 center (even rows)
const OY   = S + 4;                     // y of row-0 center
const CW   = Math.ceil(OX + (GC - 0.5) * HW + 4 + HW / 2);
const CH   = Math.ceil(OY + (GR - 1) * VH + S + 4);

// ─────────────────────────────────────────────────────────────────────────────
// COLOR PALETTE
// ─────────────────────────────────────────────────────────────────────────────
const C = {
  bg:       '#06060e',
  gridLine: '#0e1018',
  hull:     '#0a0a0d',
  divider:  '#1a3040',
  // Modules
  cockpit:  '#d4aa00',
  weapon:   '#9922cc',
  reactor:  '#119944',
  intake:   '#00bbcc',
  thruster: '#e06600',
  engine:   '#cc1111',
  wing:     '#1155bb',
};

// ─────────────────────────────────────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────────────────────────────────────
let playerTroops = new Set(); // "row,col"
let enemyTroops  = new Set();
let playerHull   = new Set();
let enemyHull    = new Set();
let playerArch   = 'NONE';
let enemyArch    = 'NONE';

// ─────────────────────────────────────────────────────────────────────────────
// CANVAS SETUP
// ─────────────────────────────────────────────────────────────────────────────
const canvas = document.getElementById('canvas');
canvas.width  = CW;
canvas.height = CH;
const ctx = canvas.getContext('2d');

// ─────────────────────────────────────────────────────────────────────────────
// HEX GEOMETRY
// ─────────────────────────────────────────────────────────────────────────────
// Returns pixel center of hex at (col, row) using pointy-top odd-r offset.
function hexCenter(col, row) {
  const odd = row & 1;
  return {
    x: OX + col * HW + (odd ? HW / 2 : 0),
    y: OY + row * VH,
  };
}

// Returns 6 vertex [x,y] pairs for a pointy-top hex centered at (cx,cy).
// Vertex order: top (v0), upper-right (v1), lower-right (v2),
//               bottom (v3), lower-left (v4), upper-left (v5).
function hexVerts(cx, cy, r) {
  r = r !== undefined ? r : S;
  const v = [];
  for (let i = 0; i < 6; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 3;
    v.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
  }
  return v;
}

// Returns neighbor [col, row] pairs in sector order:
//   0=NE, 1=E, 2=SE, 3=SW, 4=W, 5=NW
// Uses odd-r offset rules (odd rows shifted right by HW/2).
function hexNeighborCoords(col, row) {
  const o = row & 1;
  return [
    [col + o,     row - 1],  // NE  (sector 0: edge v0–v1)
    [col + 1,     row    ],  // E   (sector 1: edge v1–v2)
    [col + o,     row + 1],  // SE  (sector 2: edge v2–v3)
    [col - 1 + o, row + 1],  // SW  (sector 3: edge v3–v4)
    [col - 1,     row    ],  // W   (sector 4: edge v4–v5)
    [col - 1 + o, row - 1],  // NW  (sector 5: edge v5–v0)
  ];
}

// ─────────────────────────────────────────────────────────────────────────────
// SEEDED RNG
// ─────────────────────────────────────────────────────────────────────────────
function makeRng(seed) {
  let s = (seed >>> 0) || 0xdeadbeef;
  return () => {
    s = Math.imul(s ^ (s >>> 17), 0xbf324c81) >>> 0;
    s = Math.imul(s ^ (s >>> 13), 0x9e3779b9) >>> 0;
    s ^= s >>> 16;
    return (s >>> 0) / 0x100000000;
  };
}

function seedFromTroops(troops) {
  let s = 0x12345678;
  for (const k of [...troops].sort()) {
    const [r, c] = k.split(',').map(Number);
    s = Math.imul(s ^ (r * 997 + c * 1009), 0x6c62272e) | 0;
  }
  return s >>> 0;
}

// ─────────────────────────────────────────────────────────────────────────────
// HULL GENERATION  (hex grid edition — 11 cols × 10 rows, 5 per side)
//
// side: 'player' (rows 5-9, nose=row5) | 'enemy' (rows 0-4, nose=row4)
//
// depth   = isPlayer ? row - 5  : 4 - row    (0=nose)
// absCol  = |col - 5|                         (0=center axis, max=5)
// center  = col 5, mirror = col 10-c
// All archetype thresholds scaled from the 20×20 version (absCol ×5/9.5,
// dSpan ×4/9).
// ─────────────────────────────────────────────────────────────────────────────
function generateHull(troops, side) {
  if (!troops.size) return { hull: new Set(), archetype: 'NONE' };

  const isPlayer = side === 'player';
  const rng = makeRng(seedFromTroops(troops) ^ (isPlayer ? 0xAAAA : 0x5555));

  // ── Normalize to (depth, absCol) space ──────────────────────────────────
  const seenKeys = new Set();
  const unique = [];
  for (const k of troops) {
    const [r, c] = k.split(',').map(Number);
    const depth  = isPlayer ? r - (HALF + 1) : (HALF - 1) - r;
    const absCol = Math.abs(c - 5);
    const key    = `${depth},${Math.round(absCol * 10)}`;
    if (!seenKeys.has(key)) { seenKeys.add(key); unique.push({ depth, absCol }); }
  }

  const n       = unique.length;
  const depths  = unique.map(p => p.depth);
  const absCols = unique.map(p => p.absCol);
  const minD    = Math.min(...depths);
  const maxD    = Math.max(...depths);
  const maxA    = Math.max(...absCols);
  const dSpan   = Math.max(0, maxD - minD);
  const aspect  = dSpan === 0 ? 99 : maxA / dSpan;

  // ── Archetype detection ──────────────────────────────────────────────────
  let deltaScore = 0;
  if (n >= 2 && dSpan >= 1) {
    const sorted  = [...unique].sort((a, b) => a.depth - b.depth);
    let widening  = 0;
    for (let i = 1; i < sorted.length; i++)
      if (sorted[i].absCol > sorted[i - 1].absCol) widening++;
    deltaScore = widening / (sorted.length - 1);
  }

  let invertedDeltaScore = 0;
  if (n >= 2 && dSpan >= 1) {
    const sorted  = [...unique].sort((a, b) => a.depth - b.depth);
    let narrowing = 0;
    for (let i = 1; i < sorted.length; i++)
      if (sorted[i].absCol < sorted[i - 1].absCol) narrowing++;
    invertedDeltaScore = narrowing / (sorted.length - 1);
  }

  let isSymmetricMid = false;
  if (n >= 3 && dSpan >= 1) {
    const sorted = [...unique].sort((a, b) => a.depth - b.depth);
    const midA   = sorted[Math.floor(sorted.length / 2)].absCol;
    isSymmetricMid = midA > sorted[0].absCol &&
                     midA > sorted[sorted.length - 1].absCol &&
                     midA >= 1;
  }

  // Thresholds scaled from 20×20 (absCol ×5/9.5 ≈ 0.526, dSpan ×4/9 ≈ 0.44).
  let archetype;
  if (n === 1 && maxA < 1) {
    archetype = 'ROCKET';
  } else if (dSpan >= 3 && maxA < 1) {
    archetype = 'JAVELIN';
  } else if (deltaScore >= 0.65 && dSpan >= 2 && maxA >= 4) {
    archetype = 'STINGRAY';
  } else if (deltaScore >= 0.65 && dSpan >= 2) {
    archetype = 'DELTA';
  } else if (deltaScore >= 0.65 && dSpan === 1) {
    archetype = 'RAPTOR';
  } else if (dSpan === 0 && maxA >= 3) {
    archetype = 'SAUCER';
  } else if (maxA >= 2 && dSpan === 0) {
    archetype = 'DRONE';
  } else if (dSpan === 0 && n >= 2) {
    archetype = 'SLAB';
  } else if (invertedDeltaScore >= 0.65 && dSpan >= 2 && maxA >= 3) {
    archetype = 'WEDGE';
  } else if (invertedDeltaScore >= 0.65 && dSpan >= 2 && maxA >= 1.5) {
    archetype = 'HAMMERHEAD';
  } else if (dSpan >= 2 && maxA >= 3) {
    archetype = 'CARRIER';
  } else if (aspect >= 2.0 || (n >= 2 && maxA >= 3)) {
    archetype = 'WING';
  } else if (dSpan >= 2 && maxA < 1.5) {
    archetype = 'INTERCEPTOR';
  } else if (dSpan >= 1 && maxA <= 1) {
    archetype = 'ROCKET';
  } else if (isSymmetricMid && dSpan >= 1) {
    archetype = 'ARROWHEAD';
  } else if (dSpan >= 2 && maxA >= 2 && aspect <= 0.8) {
    archetype = 'TEARDROP';
  } else if (dSpan >= 2 && maxA >= 1 && aspect < 0.9) {
    archetype = 'CRUISER';
  } else if (n >= 4 && dSpan >= 1 && maxA >= 2) {
    archetype = 'MANTIS';
  } else if (n >= 5 && dSpan >= 1 && maxA >= 1) {
    archetype = 'SCORPION';
  } else if (aspect >= 1.0 && maxA >= 1.5) {
    archetype = 'BOMBER';
  } else {
    archetype = 'FIGHTER';
  }

  // ── Ship size proportional to formation ─────────────────────────────────
  const noseMargin = 1;
  const tailMargins = { FIGHTER:2, BOMBER:2, WING:2, ROCKET:2, DRONE:1, DELTA:2, SAUCER:1,
    STINGRAY:2, CARRIER:2, INTERCEPTOR:2, CRUISER:2, HAMMERHEAD:2,
    JAVELIN:2, RAPTOR:2, SLAB:1, WEDGE:2, ARROWHEAD:2, TEARDROP:2, SCORPION:2, MANTIS:1 };
  const sideMargins = { FIGHTER:1, BOMBER:1, WING:1, ROCKET:1, DRONE:1, DELTA:1, SAUCER:1,
    STINGRAY:1, CARRIER:1, INTERCEPTOR:1, CRUISER:1, HAMMERHEAD:1,
    JAVELIN:1, RAPTOR:1, SLAB:1, WEDGE:1, ARROWHEAD:1, TEARDROP:1, SCORPION:1, MANTIS:1 };
  const tailMargin = tailMargins[archetype] || 2;
  const sideMargin = sideMargins[archetype] || 1;
  const maxHalfW   = Math.min(5, Math.max(1, Math.ceil(maxA) + sideMargin));
  const shipDepth  = (archetype === 'SAUCER')
    ? Math.min(4, Math.max(3, maxHalfW))
    : Math.min(4, Math.max(2, dSpan + noseMargin + tailMargin));

  const depthOffset = noseMargin - minD;
  const hullBase    = minD - noseMargin;

  // ── Width envelope (t=0 nose, t=1 tail) → multiplier 0..1 ──────────────
  function envW(t) {
    switch (archetype) {
      case 'FIGHTER':
        if (t < 0.20) return t / 0.20 * 0.40;
        if (t < 0.45) return 0.40 + (t - 0.20) / 0.25 * 0.60;
        if (t < 0.70) return 1.00 - (t - 0.45) / 0.25 * 0.35;
        return 0.65 + (t - 0.70) / 0.30 * 0.15;
      case 'BOMBER':
        if (t < 0.25) return t / 0.25 * 0.75;
        if (t < 0.65) return 0.75 + (t - 0.25) / 0.40 * 0.25;
        return 1.00 - (t - 0.65) / 0.35 * 0.55;
      case 'WING':
        if (t < 0.12) return t / 0.12 * 0.20;
        if (t < 0.45) return 0.20 + (t - 0.12) / 0.33 * 0.80;
        return 1.00 - (t - 0.45) / 0.55 * 0.65;
      case 'ROCKET':
        if (t < 0.15) return t / 0.15 * 0.70;
        if (t < 0.55) return 0.70 + (t - 0.15) / 0.40 * 0.30;
        return 1.00 - (t - 0.55) / 0.45 * 0.55;
      case 'DRONE':
        return 0.12;
      case 'DELTA':
        if (t < 0.10) return t / 0.10 * 0.12;
        return 0.12 + (t - 0.10) / 0.90 * 0.88;
      case 'SAUCER': {
        const tNorm = 2 * t - 1;
        return Math.sqrt(Math.max(0, 1 - tNorm * tNorm)) * 0.85 + 0.15;
      }
      case 'STINGRAY':
        if (t < 0.05) return t / 0.05 * 0.10;
        return 0.10 + Math.sqrt((t - 0.05) / 0.95) * 0.90;
      case 'CARRIER':
        if (t < 0.10) return t / 0.10 * 0.82;
        if (t < 0.88) return 0.82 + (t - 0.10) / 0.78 * 0.18;
        return 1.00 - (t - 0.88) / 0.12 * 0.30;
      case 'INTERCEPTOR':
        if (t < 0.08) return t / 0.08 * 0.42;
        if (t < 0.55) return 0.42 + (t - 0.08) / 0.47 * 0.28;
        if (t < 0.80) return 0.70 - (t - 0.55) / 0.25 * 0.20;
        return 0.50 + (t - 0.80) / 0.20 * 0.25;
      case 'CRUISER':
        if (t < 0.12) return t / 0.12 * 0.65;
        if (t < 0.75) return 0.65 + (t - 0.12) / 0.63 * 0.35;
        return 1.00 - (t - 0.75) / 0.25 * 0.35;
      case 'HAMMERHEAD':
        if (t < 0.18) return 1.00 - (t / 0.18) * 0.50;
        if (t < 0.50) return 0.50 - (t - 0.18) / 0.32 * 0.25;
        return 0.25 + (t - 0.50) / 0.50 * 0.75;
      case 'JAVELIN':
        if (t < 0.07) return t / 0.07 * 0.14;
        if (t > 0.93) return (1 - t) / 0.07 * 0.14;
        return 0.05;
      case 'RAPTOR':
        if (t < 0.08) return t / 0.08 * 0.18;
        if (t < 0.55) return 0.18 + (t - 0.08) / 0.47 * 0.82;
        if (t < 0.80) return 1.00;
        return 1.00 - (t - 0.80) / 0.20 * 0.48;
      case 'SLAB':
        if (t < 0.14) return 0.30 + t / 0.14 * 0.70;
        if (t < 0.86) return 1.00;
        return 1.00 - (t - 0.86) / 0.14 * 0.55;
      case 'WEDGE':
        if (t < 0.08) return 0.84 + t / 0.08 * 0.16;
        if (t < 0.38) return 1.00 - (t - 0.08) / 0.30 * 0.06;
        return 0.94 - (t - 0.38) / 0.62 * 0.82;
      case 'ARROWHEAD':
        if (t < 0.44) return t / 0.44;
        return 1.00 - (t - 0.44) / 0.56;
      case 'TEARDROP':
        if (t < 0.20) return 0.12 + t / 0.20 * 0.88;
        return 1.00 - Math.pow((t - 0.20) / 0.80, 0.55) * 0.92;
      case 'SCORPION':
        if (t < 0.10) return 0.18 + t / 0.10 * 0.30;
        if (t < 0.42) return 0.48 + (t - 0.10) / 0.32 * 0.52;
        if (t < 0.72) return 1.00 - (t - 0.42) / 0.30 * 0.76;
        return 0.24 - (t - 0.72) / 0.28 * 0.18;
      case 'MANTIS':
        return 0.07;
    }
  }

  // ── Build per-row widths ─────────────────────────────────────────────────
  const minWidthForRow = new Array(shipDepth).fill(0);
  for (const p of unique) {
    const idx = Math.round(p.depth + depthOffset);
    if (idx >= 0 && idx < shipDepth)
      minWidthForRow[idx] = Math.max(minWidthForRow[idx], Math.ceil(p.absCol));
  }

  const widths = [];
  for (let i = 0; i < shipDepth; i++) {
    const t     = shipDepth <= 1 ? 0.5 : i / (shipDepth - 1);
    const base  = envW(t) * maxHalfW;
    const jitter = (rng() - 0.5) * 0.4;
    widths.push(Math.max(minWidthForRow[i], Math.max(1, Math.min(5, Math.round(base + jitter)))));
  }

  // ── Build hull hexes ─────────────────────────────────────────────────────
  const hull = new Set();

  function addRow(i, w) {
    const row = isPlayer ? HALF + 1 + hullBase + i : (HALF - 1) - hullBase - i;
    if (isPlayer  && (row < HALF + 1 || row >= GR)) return;
    if (!isPlayer && (row > HALF - 1 || row < 0)) return;
    for (let c = 5 - w; c <= 5 + w; c++)
      if (c >= 0 && c < GC) hull.add(`${row},${c}`);
  }
  function rowIndex(i) {
    return isPlayer ? HALF + 1 + hullBase + i : (HALF - 1) - hullBase - i;
  }
  function guardRow(row) {
    if (row < 0 || row >= GR) return false;
    if (isPlayer  && row < HALF + 1) return false;
    if (!isPlayer && row >= HALF) return false;
    return true;
  }

  for (let i = 0; i < shipDepth; i++) addRow(i, widths[i]);

  // ── DRONE: arm wings ─────────────────────────────────────────────────────
  if (archetype === 'DRONE') {
    for (const p of unique) {
      const armI = Math.round(p.depth + depthOffset);
      if (armI < 0 || armI >= shipDepth) continue;
      const armRow = rowIndex(armI);
      if (!guardRow(armRow)) continue;
      const armR = Math.min(GC - 1, Math.round(5 + p.absCol + 1));
      const armL = Math.max(0, 10 - armR);
      for (let c = armL; c <= armR; c++) hull.add(`${armRow},${c}`);
      // Wing-tip thickening on adjacent rows
      const tipR = armR, tipL = Math.max(armL, armR - 1);
      const mirTipL = 10 - tipR, mirTipR = 10 - tipL;
      for (const dRow of [-1, 1]) {
        const adj = isPlayer ? armRow + dRow : armRow - dRow;
        if (!guardRow(adj)) continue;
        for (let c = tipL;   c <= tipR;   c++) hull.add(`${adj},${c}`);
        for (let c = mirTipL; c <= mirTipR; c++) hull.add(`${adj},${c}`);
      }
    }
  }

  // ── FIGHTER: twin engine nacelle bumps at tail ───────────────────────────
  if (archetype === 'FIGHTER' && shipDepth >= 3) {
    for (let k = shipDepth - 2; k < shipDepth; k++) {
      const row = rowIndex(k);
      if (!guardRow(row)) continue;
      const lo = Math.max(0,      5 - widths[k] - 2);
      const hi = Math.min(GC - 1, 5 + widths[k] + 2);
      hull.add(`${row},${lo}`);
      hull.add(`${row},${hi}`);
    }
  }

  // ── CRUISER: pronounced twin engine pods at stern ────────────────────────
  if (archetype === 'CRUISER' && shipDepth >= 3) {
    for (let k = shipDepth - 2; k < shipDepth; k++) {
      const row = rowIndex(k);
      if (!guardRow(row)) continue;
      const lo = Math.max(0,      5 - widths[k] - 2);
      const hi = Math.min(GC - 1, 5 + widths[k] + 2);
      hull.add(`${row},${lo}`); hull.add(`${row},${lo + 1}`);
      hull.add(`${row},${hi}`); hull.add(`${row},${hi - 1}`);
    }
  }

  // ── INTERCEPTOR / JAVELIN: sharp needle nose extension ───────────────────
  if (archetype === 'INTERCEPTOR' || archetype === 'JAVELIN') {
    const noseRow = isPlayer ? HALF + hullBase : (HALF - 1) - hullBase + 1;
    if (guardRow(noseRow)) hull.add(`${noseRow},5`);
  }

  // ── CARRIER: flight deck protrusion at nose ──────────────────────────────
  if (archetype === 'CARRIER') {
    for (let ext = 1; ext <= 1; ext++) {
      const deckRow = isPlayer ? HALF + 1 + hullBase - ext : (HALF - 1) - hullBase + ext;
      if (!guardRow(deckRow)) continue;
      const deckW = Math.max(1, Math.round(maxHalfW * (0.5 - ext * 0.15)));
      for (let c = 5 - deckW; c <= 5 + deckW; c++)
        if (c >= 0 && c < GC) hull.add(`${deckRow},${c}`);
    }
  }

  // ── SAUCER: equatorial band thickening ───────────────────────────────────
  if (archetype === 'SAUCER' && shipDepth >= 3) {
    const eq = Math.floor(shipDepth / 2);
    for (let di = -1; di <= 1; di++) {
      const k = eq + di;
      if (k < 0 || k >= shipDepth) continue;
      const row = rowIndex(k);
      if (!guardRow(row)) continue;
      const eqW = Math.min(5, widths[k] + 1);
      for (let c = 5 - eqW; c <= 5 + eqW; c++)
        if (c >= 0 && c < GC) hull.add(`${row},${c}`);
    }
  }

  // ── HAMMERHEAD: wide cephalofoil at nose ─────────────────────────────────
  if (archetype === 'HAMMERHEAD') {
    for (let k = 0; k < Math.min(2, shipDepth); k++) {
      const row = rowIndex(k);
      if (!guardRow(row)) continue;
      const headW = Math.min(5, Math.round(maxHalfW * 0.9));
      for (let c = 5 - headW; c <= 5 + headW; c++)
        if (c >= 0 && c < GC) hull.add(`${row},${c}`);
    }
  }

  // ── STINGRAY: swept wingtip thickening ───────────────────────────────────
  if (archetype === 'STINGRAY') {
    for (const p of unique) {
      const armI = Math.round(p.depth + depthOffset);
      if (armI < 0 || armI >= shipDepth) continue;
      const armRow = rowIndex(armI);
      if (!guardRow(armRow)) continue;
      const tipR = Math.min(GC - 1, Math.round(5 + p.absCol + 1));
      const tipL = Math.max(0, 10 - tipR);
      for (const dRow of [-1, 0, 1]) {
        const adj = isPlayer ? armRow + dRow : armRow - dRow;
        if (!guardRow(adj)) continue;
        for (let c = tipL;     c <= tipR;     c++) hull.add(`${adj},${c}`);
        for (let c = 10 - tipR; c <= 10 - tipL; c++) hull.add(`${adj},${c}`);
      }
    }
  }

  // ── SCORPION: stinger tail extension ─────────────────────────────────────
  if (archetype === 'SCORPION') {
    const stingRow = isPlayer ? HALF + 1 + hullBase + shipDepth : (HALF - 1) - hullBase - shipDepth;
    if (guardRow(stingRow)) hull.add(`${stingRow},5`);
  }

  // ── MANTIS: multi-level arm wings ────────────────────────────────────────
  if (archetype === 'MANTIS') {
    for (const p of unique) {
      if (p.absCol < 2) continue;
      const armI = Math.round(p.depth + depthOffset);
      if (armI < 0 || armI >= shipDepth) continue;
      const armRow = rowIndex(armI);
      if (!guardRow(armRow)) continue;
      const armR = Math.min(GC - 1, Math.round(5 + p.absCol + 1));
      const armL = Math.max(0, 10 - armR);
      for (let c = armL;     c <= armR;     c++) hull.add(`${armRow},${c}`);
      for (let c = 10 - armR; c <= 10 - armL; c++) hull.add(`${armRow},${c}`);
    }
  }

  return { hull, archetype };
}

// ─────────────────────────────────────────────────────────────────────────────
// HULL NEIGHBOR HELPERS  (hex 6-direction)
// ─────────────────────────────────────────────────────────────────────────────
// Interior = all 6 hex neighbors present in hull.
function isInterior(col, row, hull) {
  return hexNeighborCoords(col, row).every(([nc, nr]) => hull.has(`${nr},${nc}`));
}

// ─────────────────────────────────────────────────────────────────────────────
// HEX DRAWING PRIMITIVES
// ─────────────────────────────────────────────────────────────────────────────
// Fill a complete hexagon with the given color.
// Pass a custom radius r to draw an inset/scaled version.
function fillHex(col, row, color, r) {
  const { x, y } = hexCenter(col, row);
  const v = hexVerts(x, y, r !== undefined ? r : S);
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(v[0][0], v[0][1]);
  for (let i = 1; i < 6; i++) ctx.lineTo(v[i][0], v[i][1]);
  ctx.closePath();
  ctx.fill();
}

// Draw hull hex — solid filled hexagon.
function drawHullHex(col, row) {
  fillHex(col, row, C.hull);
}

// ─────────────────────────────────────────────────────────────────────────────
// MODULE COLOR ASSIGNMENT
// noseProgress 0=nose row, 1=tail row   colDist 0=center axis, 1=edge
// ─────────────────────────────────────────────────────────────────────────────
function moduleColor(noseP, colDist) {
  if (colDist > 0.6) {
    // Outer edge — wing hardware / intakes
    return noseP < 0.5 ? C.intake : C.wing;
  }
  if (noseP < 0.20) return C.cockpit;
  if (noseP < 0.45) return C.weapon;
  if (noseP < 0.62) return C.reactor;
  if (noseP < 0.82) return C.thruster;
  return C.engine;
}

// Draw an interior module hex — whole inset hexagon filled with a single color.
// The dark hull background shows as a thin border between tiles.
function drawModuleHex(col, row, side, hullBounds) {
  const isPlayer = side === 'player';
  const span     = Math.max(1, Math.abs(hullBounds.tailRow - hullBounds.noseRow));
  const noseP    = Math.max(0, Math.min(1,
    isPlayer ? (row - hullBounds.noseRow) / span
             : (hullBounds.noseRow - row) / span
  ));
  const colDist = Math.abs(col - 5) / 5;
  const color   = moduleColor(noseP, colDist);
  // Inset by ~2.5 px so the dark hull behind bleeds through as a hex-grid gap
  fillHex(col, row, color, S - 2.5);
}

// Compute actual nose/tail row from a hull Set.
function hullRowBounds(hull, isPlayer) {
  let noseRow = isPlayer ? GR - 1 : 0;
  let tailRow = isPlayer ? HALF + 1 : HALF - 1;
  for (const k of hull) {
    const r = +k.split(',')[0];
    if (isPlayer) {
      if (r < noseRow) noseRow = r;
      if (r > tailRow) tailRow = r;
    } else {
      if (r > noseRow) noseRow = r;
      if (r < tailRow) tailRow = r;
    }
  }
  return { noseRow, tailRow };
}

// ─────────────────────────────────────────────────────────────────────────────
// TROOP MARKER
// ─────────────────────────────────────────────────────────────────────────────
function drawTroopMarker(col, row, side) {
  const { x, y } = hexCenter(col, row);
  const isPlayer = side === 'player';

  // Glow
  const grd = ctx.createRadialGradient(x, y, 1, x, y, S * 0.45);
  grd.addColorStop(0, isPlayer ? 'rgba(80,180,255,0.40)' : 'rgba(255,80,80,0.40)');
  grd.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grd;
  ctx.beginPath();
  ctx.arc(x, y, S * 0.45, 0, Math.PI * 2);
  ctx.fill();

  // Center dot
  ctx.fillStyle = isPlayer ? '#88ccff' : '#ff8888';
  ctx.beginPath();
  ctx.arc(x, y, 3.5, 0, Math.PI * 2);
  ctx.fill();

  // Cross reticle
  ctx.strokeStyle = isPlayer ? 'rgba(100,200,255,0.7)' : 'rgba(255,100,100,0.7)';
  ctx.lineWidth = 0.8;
  ctx.beginPath();
  ctx.moveTo(x - 7, y); ctx.lineTo(x + 7, y);
  ctx.moveTo(x, y - 7); ctx.lineTo(x, y + 7);
  ctx.stroke();
}

// ─────────────────────────────────────────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────────────────────────────────────────
const BATTLE_Y = OY + HALF * VH;  // horizontal battle line y-coordinate (center of row 5)

function render() {
  // ── Background ──────────────────────────────────────────────
  ctx.fillStyle = C.bg;
  ctx.fillRect(0, 0, CW, CH);

  // ── Half-zone tints ─────────────────────────────────────────
  ctx.fillStyle = 'rgba(180,40,40,0.025)';
  ctx.fillRect(0, 0, CW, BATTLE_Y);
  ctx.fillStyle = 'rgba(40,120,180,0.025)';
  ctx.fillRect(0, BATTLE_Y, CW, CH - BATTLE_Y);

  // ── Hex grid lines ───────────────────────────────────────────
  ctx.strokeStyle = C.gridLine;
  ctx.lineWidth = 0.5;
  for (let row = 0; row < GR; row++) {
    for (let col = 0; col < GC; col++) {
      const { x, y } = hexCenter(col, row);
      const v = hexVerts(x, y);
      ctx.beginPath();
      ctx.moveTo(v[0][0], v[0][1]);
      for (let i = 1; i < 6; i++) ctx.lineTo(v[i][0], v[i][1]);
      ctx.closePath();
      ctx.stroke();
    }
  }

  // ── HULL PASS 1 — draw complete filled hexagons ────────────────────────
  for (const key of enemyHull) {
    const [r, c] = key.split(',').map(Number);
    drawHullHex(c, r);
  }
  for (const key of playerHull) {
    const [r, c] = key.split(',').map(Number);
    drawHullHex(c, r);
  }

  // ── HULL PASS 2 — colored interior modules ──────────────────
  const eBounds = enemyHull.size  ? hullRowBounds(enemyHull,  false) : { noseRow: HALF-1, tailRow: 0 };
  const pBounds = playerHull.size ? hullRowBounds(playerHull, true)  : { noseRow: HALF+1, tailRow: GR-1 };
  for (const key of enemyHull) {
    const [r, c] = key.split(',').map(Number);
    if (isInterior(c, r, enemyHull) && !enemyTroops.has(key))
      drawModuleHex(c, r, 'enemy', eBounds);
  }
  for (const key of playerHull) {
    const [r, c] = key.split(',').map(Number);
    if (isInterior(c, r, playerHull) && !playerTroops.has(key))
      drawModuleHex(c, r, 'player', pBounds);
  }

  // ── Troop markers ────────────────────────────────────────────
  for (const key of enemyTroops) {
    const [r, c] = key.split(',').map(Number);
    drawTroopMarker(c, r, 'enemy');
  }
  for (const key of playerTroops) {
    const [r, c] = key.split(',').map(Number);
    drawTroopMarker(c, r, 'player');
  }

  // ── Center divider ───────────────────────────────────────────
  ctx.strokeStyle = C.divider;
  ctx.lineWidth = 1.5;
  ctx.setLineDash([4, 6]);
  ctx.beginPath();
  ctx.moveTo(0, BATTLE_Y); ctx.lineTo(CW, BATTLE_Y);
  ctx.stroke();
  ctx.setLineDash([]);

  // Divider label
  ctx.fillStyle = '#1a3040';
  ctx.font = '9px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText('-- BATTLE LINE --', CW / 2, BATTLE_Y - 3);

  // ── Zone labels ───────────────────────────────────────────────
  ctx.font = '9px Courier New';
  ctx.fillStyle = '#1a1a2a';
  ctx.textAlign = 'left';
  ctx.fillText('ENEMY', 4, 12);
  ctx.textAlign = 'right';
  ctx.fillText('PLAYER', CW - 4, CH - 4);
  ctx.textAlign = 'left';

  // ── Archetype display ─────────────────────────────────────────
  document.getElementById('enemy-arch-name').textContent  = enemyArch;
  document.getElementById('player-arch-name').textContent = playerArch;
}

// ─────────────────────────────────────────────────────────────────────────────
// REGENERATE BOTH SHIPS
// ─────────────────────────────────────────────────────────────────────────────
function regen() {
  const p = generateHull(playerTroops, 'player');
  const e = generateHull(enemyTroops,  'enemy');
  playerHull  = p.hull;  playerArch  = p.archetype;
  enemyHull   = e.hull;  enemyArch   = e.archetype;
  render();
}

// ─────────────────────────────────────────────────────────────────────────────
// HEX HIT-TEST  (nearest-center search)
// ─────────────────────────────────────────────────────────────────────────────
function pixelToHex(px, py) {
  // Estimate nearest row
  const rowEst = Math.round((py - OY) / VH);
  let bestCol = -1, bestRow = -1, bestDist = Infinity;
  for (let dr = -1; dr <= 1; dr++) {
    const row = rowEst + dr;
    if (row < 0 || row >= GR) continue;
    const odd    = row & 1;
    const colEst = Math.round((px - OX - (odd ? HW / 2 : 0)) / HW);
    for (let dc = -1; dc <= 1; dc++) {
      const col = colEst + dc;
      if (col < 0 || col >= GC) continue;
      const { x, y } = hexCenter(col, row);
      const d = (px - x) ** 2 + (py - y) ** 2;
      if (d < bestDist) { bestDist = d; bestCol = col; bestRow = row; }
    }
  }
  return { col: bestCol, row: bestRow };
}

// ─────────────────────────────────────────────────────────────────────────────
// TROOP PLACEMENT INTERACTION
// ─────────────────────────────────────────────────────────────────────────────
function handleClick(clientX, clientY) {
  const rect   = canvas.getBoundingClientRect();
  const scaleX = CW / rect.width;
  const scaleY = CH / rect.height;
  const px     = (clientX - rect.left) * scaleX;
  const py     = (clientY - rect.top)  * scaleY;
  const { col, row } = pixelToHex(px, py);
  if (col < 0 || col >= GC || row < 0 || row >= GR) return;

  if (row >= HALF + 1) {
    // Player half — toggle troop
    const key = `${row},${col}`;
    if (playerTroops.has(key)) playerTroops.delete(key);
    else                       playerTroops.add(key);
    regen();
  }
}

canvas.addEventListener('mousedown', e => { e.preventDefault(); handleClick(e.clientX, e.clientY); });
canvas.addEventListener('touchstart', e => { e.preventDefault(); handleClick(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });

// ─────────────────────────────────────────────────────────────────────────────
// BUTTON ACTIONS — patterns scaled for 11-col × 11-row hex grid
// rowStart: player=6, enemy=0   center row=5 (neutral)   cols: 0-10, center=5, mirror=10-c
// ─────────────────────────────────────────────────────────────────────────────
function randomTroopsForSide(side) {
  const rng      = makeRng(Date.now() & 0x7fffffff);
  const troops   = new Set();
  const rowStart = side === 'player' ? HALF + 1 : 0;

  function add(r, c) {
    if (r < 0 || r >= GR) return;
    if (side === 'player' && r < HALF + 1) return;
    if (side === 'enemy'  && r >= HALF) return;
    if (c < 0 || c >= GC) return;
    troops.add(`${r},${c}`);
  }

  // addPair: place at (r,c) and its lateral mirror (r, 10-c)
  function addPair(r, c) {
    add(r, c);
    add(r, 10 - c);
  }

  const pattern = Math.floor(rng() * 20);
  switch (pattern) {
    case 0: { // FIGHTER: tight central cluster
      const dr = Math.floor(rng() * 2);
      addPair(rowStart + 1 + dr, 6 + Math.floor(rng() * 2));
      addPair(rowStart + 2 + dr, 7 + Math.floor(rng() * 1));
      break;
    }
    case 1: { // DRONE: wide same-depth → arm drone
      const d = Math.floor(rng() * 2);
      addPair(rowStart + 1 + d, 8 + Math.floor(rng() * 2));
      break;
    }
    case 2: { // DELTA / B2: triangle widening with depth
      addPair(rowStart + 1, 5);
      addPair(rowStart + 2, 7 + Math.floor(rng() * 1));
      addPair(rowStart + 3, 9 + Math.floor(rng() * 1));
      break;
    }
    case 3: { // ROCKET: narrow vertical column
      const col = 5 + Math.floor(rng() * 2);
      const len = 2 + Math.floor(rng() * 2);
      for (let i = 0; i < len; i++) addPair(rowStart + 1 + i, col);
      break;
    }
    case 4: { // WING: wide troops at different depths
      const d = Math.floor(rng() * 2);
      addPair(rowStart + 1 + d, 9 + Math.floor(rng() * 1));
      addPair(rowStart + 2 + d, 7 + Math.floor(rng() * 2));
      break;
    }
    case 5: { // BOMBER: medium width, squat
      const base = rowStart + 1;
      const col  = 7 + Math.floor(rng() * 1);
      addPair(base,     col);
      addPair(base + 1, col);
      break;
    }
    case 6: { // SAUCER: ultra-wide same-depth → flying disc (maxA≥3, dSpan=0)
      const row = rowStart + 1 + Math.floor(rng() * 1);
      addPair(row, 9 + Math.floor(rng() * 1));
      if (rng() > 0.4) addPair(row, 7);
      break;
    }
    case 7: { // STINGRAY: ultra-wide swept delta (deltaScore≥0.65, maxA≥4)
      addPair(rowStart + 1, 5);
      addPair(rowStart + 2, 7 + Math.floor(rng() * 1));
      addPair(rowStart + 3, 9 + Math.floor(rng() * 1));
      break;
    }
    case 8: { // CARRIER: wide AND deep (dSpan≥2, maxA≥3)
      const col = 8 + Math.floor(rng() * 2);
      const dep = 2 + Math.floor(rng() * 1);
      for (let i = 0; i < dep; i++) addPair(rowStart + 1 + i, col);
      break;
    }
    case 9: { // INTERCEPTOR: long + narrow (dSpan≥2, maxA<1.5)
      const col = 5 + Math.floor(rng() * 1);
      const len = 2 + Math.floor(rng() * 2);
      for (let i = 0; i < len; i++) addPair(rowStart + 1 + i, col);
      break;
    }
    case 10: { // CRUISER: long body, moderate width (dSpan≥2, maxA≥1, aspect<0.9)
      const col = 7 + Math.floor(rng() * 1);
      const len = 2 + Math.floor(rng() * 2);
      for (let i = 0; i < len; i++) addPair(rowStart + 1 + i, col);
      break;
    }
    case 11: { // HAMMERHEAD: wide nose narrowing (invertedDelta, maxA≥1.5)
      addPair(rowStart + 1, 8 + Math.floor(rng() * 2));
      addPair(rowStart + 2, 6 + Math.floor(rng() * 1));
      addPair(rowStart + 3, 5);
      break;
    }
    case 12: { // JAVELIN: ultra-long ultra-thin (dSpan≥3, maxA<1)
      for (let i = 0; i < 4; i++) add(rowStart + 1 + i, 5);
      break;
    }
    case 13: { // RAPTOR: shallow swept wing (deltaScore≥0.65, dSpan=1)
      addPair(rowStart + 1, 5);
      addPair(rowStart + 2, 8 + Math.floor(rng() * 2));
      break;
    }
    case 14: { // SLAB: same-depth, spread (dSpan=0, n≥2)
      const col = 7 + Math.floor(rng() * 1);
      addPair(rowStart + 1 + Math.floor(rng() * 1), col);
      break;
    }
    case 15: { // WEDGE: wide nose narrowing (invertedDelta, maxA≥3)
      addPair(rowStart + 1, 9);
      addPair(rowStart + 2, 6 + Math.floor(rng() * 1));
      addPair(rowStart + 3, 5);
      break;
    }
    case 16: { // ARROWHEAD: narrow front, wide mid, narrow back
      addPair(rowStart + 1, 5);
      addPair(rowStart + 2, 7 + Math.floor(rng() * 2));
      addPair(rowStart + 3, 5);
      break;
    }
    case 17: { // TEARDROP: fat nose, streaming tail
      addPair(rowStart + 1, 7);
      addPair(rowStart + 2, 7);
      addPair(rowStart + 3, 6);
      add(rowStart + 4, 5);
      break;
    }
    case 18: { // SCORPION: complex multi-troop cluster (n≥5)
      addPair(rowStart + 1, 7);
      addPair(rowStart + 2, 6);
      add(rowStart + 3, 5);
      add(rowStart + 4, 5);
      break;
    }
    case 19: { // MANTIS: multi-level arm wings (n≥4, maxA≥2)
      addPair(rowStart + 1, 8);
      addPair(rowStart + 2, 8);
      add(rowStart + 2, 5);
      break;
    }
  }
  return troops;
}

function randomizePlayer() {
  playerTroops = randomTroopsForSide('player');
  regen();
}
function randomizeEnemy() {
  enemyTroops = randomTroopsForSide('enemy');
  regen();
}
function clearPlayer() {
  playerTroops.clear();
  regen();
}
function clearAll() {
  playerTroops.clear();
  enemyTroops.clear();
  regen();
}

// ─────────────────────────────────────────────────────────────────────────────
// INITIAL STATE — player=DELTA, enemy=DRONE
// ─────────────────────────────────────────────────────────────────────────────
(function init() {
  // Player: widening triangle → DELTA
  [[6, 5], [7, 7], [8, 9]].forEach(([r, c]) => {
    playerTroops.add(`${r},${c}`);
    playerTroops.add(`${r},${10 - c}`);
  });

  // Enemy: wide same-depth pair → DRONE
  [[2, 8]].forEach(([r, c]) => {
    enemyTroops.add(`${r},${c}`);
    enemyTroops.add(`${r},${10 - c}`);
  });

  regen();
})();
</script>
