<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spaceship Grid – Visual Prototype</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #06060e;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  min-height: 100vh;
  font-family: 'Courier New', monospace;
  color: #8899aa;
  padding: 20px 0 30px;
  user-select: none;
}
h1 {
  font-size: 13px;
  letter-spacing: 4px;
  color: #334455;
  text-transform: uppercase;
  margin-bottom: 10px;
}
#wrap {
  position: relative;
  display: inline-block;
  margin: 6px 0;
}
canvas {
  display: block;
  cursor: crosshair;
  image-rendering: pixelated;
}
.controls {
  display: flex;
  gap: 8px;
  margin-top: 10px;
  flex-wrap: wrap;
  justify-content: center;
}
button {
  background: #0d0d1a;
  color: #667788;
  border: 1px solid #1e2a3a;
  padding: 6px 14px;
  font-family: 'Courier New', monospace;
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
  cursor: pointer;
  transition: border-color .15s, color .15s;
}
button:hover { border-color: #3a6a8a; color: #aaccdd; }
#info {
  margin-top: 10px;
  font-size: 11px;
  letter-spacing: 2px;
  color: #2a4455;
  text-align: center;
  line-height: 1.8;
}
#archetypes {
  display: flex;
  gap: 20px;
  margin-top: 8px;
  font-size: 11px;
  letter-spacing: 2px;
}
.arch-label { text-align: center; }
.arch-label span { display: block; }
.arch-label .name { font-size: 13px; letter-spacing: 3px; }
#enemy-arch .name { color: #cc4444; }
#player-arch .name { color: #44aacc; }
</style>
</head>
<body>
<h1>Spaceship Grid · Visual Prototype</h1>
<div id="wrap"><canvas id="canvas"></canvas></div>
<div class="controls">
  <button onclick="randomizePlayer()">⟳ Randomize Player</button>
  <button onclick="randomizeEnemy()">⟳ Randomize Enemy</button>
  <button onclick="clearPlayer()">✕ Clear Player</button>
  <button onclick="clearAll()">✕ Clear All</button>
</div>
<div id="archetypes">
  <div class="arch-label" id="enemy-arch">
    <span class="name" id="enemy-arch-name">–</span>
    <span style="color:#334455">ENEMY</span>
  </div>
  <div class="arch-label" id="player-arch">
    <span class="name" id="player-arch-name">–</span>
    <span style="color:#334455">PLAYER</span>
  </div>
</div>
<div id="info">
  Click bottom half to place/remove troops freely · shadow stays symmetrical<br>
  Ship silhouette updates live · colored modules fill interior spaces
</div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// CONSTANTS
// ─────────────────────────────────────────────────────────────────────────────
const G   = 20;          // grid size 20×20
const CS  = 34;          // cell size in pixels
const CW  = G * CS;
const CH  = G * CS;

// ─────────────────────────────────────────────────────────────────────────────
// MODULE / COLOR PALETTE
// ─────────────────────────────────────────────────────────────────────────────
const C = {
  bg:        '#06060e',
  gridLine:  '#0e1018',
  gridX:     '#0b0c14',
  hull:      '#0a0a0d',
  hullEdge:  '#111116',
  divider:   '#1a3040',
  troop:     '#ffffff',
  troopGlow: 'rgba(255,255,255,0.15)',
  // Modules
  cockpit:   '#d4aa00',   // yellow
  weapon:    '#9922cc',   // purple
  reactor:   '#119944',   // green
  intake:    '#00bbcc',   // cyan
  thruster:  '#e06600',   // orange
  engine:    '#cc1111',   // red
  wing:      '#1155bb',   // blue
};

// ─────────────────────────────────────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────────────────────────────────────
let playerTroops = new Set(); // "r,c"
let enemyTroops  = new Set();
let playerHull   = new Set();
let enemyHull    = new Set();
let playerArch   = 'NONE';
let enemyArch    = 'NONE';

// ─────────────────────────────────────────────────────────────────────────────
// CANVAS SETUP
// ─────────────────────────────────────────────────────────────────────────────
const canvas = document.getElementById('canvas');
canvas.width  = CW;
canvas.height = CH;
const ctx = canvas.getContext('2d');

// ─────────────────────────────────────────────────────────────────────────────
// SEEDED RNG
// ─────────────────────────────────────────────────────────────────────────────
function makeRng(seed) {
  let s = (seed >>> 0) || 0xdeadbeef;
  return () => {
    s = Math.imul(s ^ (s >>> 17), 0xbf324c81) >>> 0;
    s = Math.imul(s ^ (s >>> 13), 0x9e3779b9) >>> 0;
    s ^= s >>> 16;
    return (s >>> 0) / 0x100000000;
  };
}

function seedFromTroops(troops) {
  let s = 0x12345678;
  for (const k of [...troops].sort()) {
    const [r, c] = k.split(',').map(Number);
    s = Math.imul(s ^ (r * 997 + c * 1009), 0x6c62272e) | 0;
  }
  return s >>> 0;
}

// ─────────────────────────────────────────────────────────────────────────────
// HULL GENERATION  (formation-proportional, geometry-driven)
//
// side: 'player' (rows 10-19, nose=row10) | 'enemy' (rows 0-9, nose=row9)
//
// Key design:
//   • Ship size = troop bounding box + small margins.  1 troop → tiny ship.
//   • Archetype is derived from geometric relationships of the formation:
//       DRONE  – few troops, wide lateral spread  → thin spine + arm wings
//       DELTA  – troops widen with depth          → B2 / flying-wing delta
//       WING   – flat wide row                   → broad flying wing
//       BOMBER – moderate width, squat depth      → fat bomber silhouette
//       ROCKET – narrow deep column               → pencil / rocket
//       FIGHTER– everything else                  → classic jet with nacelles
// ─────────────────────────────────────────────────────────────────────────────
function generateHull(troops, side) {
  if (!troops.size) return { hull: new Set(), archetype: 'NONE' };

  const isPlayer = side === 'player';
  const rng = makeRng(seedFromTroops(troops) ^ (isPlayer ? 0xAAAA : 0x5555));

  // ── Normalize to (depth, absCol) space ──────────────────────────────────
  // depth: 0 = nose-most grid row (row 10 for player, row 9 for enemy)
  // absCol: absolute distance from center axis (9.5), always ≥ 0
  const seenKeys = new Set();
  const unique = [];   // de-duplicated unique (depth, absCol) pairs
  for (const k of troops) {
    const [r, c] = k.split(',').map(Number);
    const depth  = isPlayer ? r - 10 : 9 - r;
    const absCol = Math.abs(c - 9.5);
    const key    = `${depth},${Math.round(absCol * 10)}`;
    if (!seenKeys.has(key)) { seenKeys.add(key); unique.push({ depth, absCol }); }
  }

  const n       = unique.length;
  const depths  = unique.map(p => p.depth);
  const absCols = unique.map(p => p.absCol);
  const minD    = Math.min(...depths);
  const maxD    = Math.max(...depths);
  const maxA    = Math.max(...absCols);
  const dSpan   = Math.max(0, maxD - minD);  // depth range of formation
  const aspect  = dSpan === 0 ? 99 : maxA / dSpan; // lateral/depth ratio

  // ── Archetype detection ──────────────────────────────────────────────────
  // Check delta: troops get progressively wider with depth (B2/triangle)
  let deltaScore = 0;
  if (n >= 3 && dSpan >= 2) {
    const sorted  = [...unique].sort((a, b) => a.depth - b.depth);
    let widening  = 0;
    for (let i = 1; i < sorted.length; i++)
      if (sorted[i].absCol > sorted[i - 1].absCol) widening++;
    deltaScore = widening / (sorted.length - 1);
  }

  let archetype;
  if (n === 1 && maxA < 1.5) {
    archetype = 'ROCKET';                           // single narrow troop
  } else if (deltaScore >= 0.65 && dSpan >= 2) {
    // ≥65 % of consecutive depth-sorted pairs widen → reliably a triangle/delta formation
    archetype = 'DELTA';                            // widening triangle → B2
  } else if (maxA >= 4.0 && dSpan === 0) {
    archetype = 'DRONE';                            // all troops same depth, wide → arm drone
  } else if (aspect >= 2.0 || (n >= 2 && maxA >= 6)) {
    archetype = 'WING';                             // flat wide spread
  } else if (dSpan >= 3 && maxA <= 2.5) {
    archetype = 'ROCKET';                           // deep narrow column
  } else if (aspect >= 1.0 && maxA >= 2.5) {
    archetype = 'BOMBER';                           // moderate width/depth
  } else {
    archetype = 'FIGHTER';
  }

  // ── Ship size proportional to formation ─────────────────────────────────
  const noseMargin = 1;
  const tailMargins = { FIGHTER: 2, BOMBER: 2, WING: 2, ROCKET: 3, DRONE: 1, DELTA: 2 };
  const sideMargins = { FIGHTER: 2, BOMBER: 2, WING: 1, ROCKET: 1, DRONE: 1, DELTA: 1 };
  const tailMargin  = tailMargins[archetype] || 2;
  const sideMargin  = sideMargins[archetype] || 2;
  const shipDepth   = Math.min(9, Math.max(3, dSpan + noseMargin + tailMargin));
  const maxHalfW    = Math.min(9, Math.max(1, Math.ceil(maxA) + sideMargin));

  // depthOffset: shifts formation depths so minD maps to noseMargin index
  const depthOffset = noseMargin - minD;
  // hullBase: grid-row offset so the hull nose sits noseMargin rows above the
  // shallowest troop – this guarantees every troop lands inside the hull
  const hullBase = minD - noseMargin;

  // ── Width envelope (t=0 nose, t=1 tail) → multiplier 0..1 ──────────────
  function envW(t) {
    switch (archetype) {
      case 'FIGHTER':
        // Needle nose → wing swell → slight pinch → engine bump tail
        if (t < 0.20) return t / 0.20 * 0.40;
        if (t < 0.45) return 0.40 + (t - 0.20) / 0.25 * 0.60;
        if (t < 0.70) return 1.00 - (t - 0.45) / 0.25 * 0.35;
        return 0.65 + (t - 0.70) / 0.30 * 0.15;
      case 'BOMBER':
        // Wide fat belly, taper both ends
        if (t < 0.25) return t / 0.25 * 0.75;
        if (t < 0.65) return 0.75 + (t - 0.25) / 0.40 * 0.25;
        return 1.00 - (t - 0.65) / 0.35 * 0.55;
      case 'WING':
        // Sharp needle → sweeping wide → moderate taper
        if (t < 0.12) return t / 0.12 * 0.20;
        if (t < 0.45) return 0.20 + (t - 0.12) / 0.33 * 0.80;
        return 1.00 - (t - 0.45) / 0.55 * 0.65;
      case 'ROCKET':
        // Thin constant body with small bulge mid
        if (t < 0.15) return t / 0.15 * 0.70;
        if (t < 0.55) return 0.70 + (t - 0.15) / 0.40 * 0.30;
        return 1.00 - (t - 0.55) / 0.45 * 0.55;
      case 'DRONE':
        // Ultra-thin spine (arms handled separately)
        return 0.12;
      case 'DELTA':
        // Razor point → steadily sweeps to a broad trailing delta edge (B2)
        if (t < 0.10) return t / 0.10 * 0.12;
        return 0.12 + (t - 0.10) / 0.90 * 0.88;
      default:
        return 0.5;
    }
  }

  // ── Build per-row widths ─────────────────────────────────────────────────
  // First pass: for each hull row index, record the minimum half-width needed
  // to cover the troops mapped to that row (so no troop ever falls outside).
  const minWidthForRow = new Array(shipDepth).fill(0);
  for (const p of unique) {
    const idx = Math.round(p.depth + depthOffset);
    if (idx >= 0 && idx < shipDepth)
      minWidthForRow[idx] = Math.max(minWidthForRow[idx], Math.ceil(p.absCol));
  }

  const widths = [];
  for (let i = 0; i < shipDepth; i++) {
    const t    = shipDepth <= 1 ? 0.5 : i / (shipDepth - 1);
    const base = envW(t) * maxHalfW;
    const jitter = (rng() - 0.5) * 0.8; // ±0.4 cell organic variation so rows aren't perfectly stepped
    // Ensure the width is at least enough to contain any troop on this row
    widths.push(Math.max(minWidthForRow[i], Math.max(1, Math.min(9, Math.round(base + jitter)))));
  }

  // ── Build hull cells ─────────────────────────────────────────────────────
  const hull = new Set();

  for (let i = 0; i < shipDepth; i++) {
    // Anchor to troop formation: nose sits hullBase steps from the half boundary
    const row = isPlayer ? 10 + hullBase + i : 9 - hullBase - i;
    // Never cross the battle line
    if (isPlayer  && (row < 10 || row >= G)) continue;
    if (!isPlayer && (row > 9  || row < 0))  continue;
    const w = widths[i];
    for (let c = 10 - w; c <= 9 + w; c++)
      if (c >= 0 && c < G) hull.add(`${row},${c}`);
  }

  // ── DRONE: arm wings extend to troop lateral positions ──────────────────
  if (archetype === 'DRONE') {
    for (const p of unique) {
      const armI = Math.round(p.depth + depthOffset);
      if (armI < 0 || armI >= shipDepth) continue;
      const armRow = isPlayer ? 10 + hullBase + armI : 9 - hullBase - armI;
      // Never cross battle line
      if (isPlayer  && (armRow < 10 || armRow >= G)) continue;
      if (!isPlayer && (armRow > 9  || armRow < 0))  continue;

      // Full arm span: symmetric, from mirror to troop column + 1 overhang
      const armR  = Math.min(18, Math.round(9.5 + p.absCol + 1));
      const armL  = Math.max(1,  19 - armR);
      for (let c = armL; c <= armR; c++) hull.add(`${armRow},${c}`);

      // Wing-tip thickening: outer 3 cells (±2 from armR) on adjacent rows make
      // wingtips look solid/3D rather than a single-cell-thin edge
      const tipR = armR, tipL = Math.max(armL, armR - 2);
      const mirTipR = 19 - tipL, mirTipL = 19 - tipR;
      for (const dRow of [-1, 1]) {
        const adjRow = isPlayer ? armRow + dRow : armRow - dRow;
        if (adjRow < 0 || adjRow >= G) continue;
        if (isPlayer && adjRow < 10) continue;
        if (!isPlayer && adjRow > 9) continue;
        for (let c = tipL;    c <= tipR;    c++) hull.add(`${adjRow},${c}`);
        for (let c = mirTipL; c <= mirTipR; c++) hull.add(`${adjRow},${c}`);
      }
    }
  }

  // ── FIGHTER: twin engine nacelle bumps at tail ───────────────────────────
  if (archetype === 'FIGHTER' && shipDepth >= 4) {
    for (let k = shipDepth - 2; k < shipDepth; k++) {
      const row  = isPlayer ? 10 + hullBase + k : 9 - hullBase - k;
      if (isPlayer  && (row < 10 || row >= G)) continue;
      if (!isPlayer && (row > 9  || row < 0))  continue;
      const nacW = widths[k] + 1;
      const lo   = 10 - nacW - 1,  hi = 9 + nacW + 1;
      if (lo >= 0) hull.add(`${row},${lo}`);
      if (hi < G)  hull.add(`${row},${hi}`);
    }
  }

  return { hull, archetype };
}

// ─────────────────────────────────────────────────────────────────────────────
// HULL NEIGHBOR HELPERS
// ─────────────────────────────────────────────────────────────────────────────
function inHull(r, c, hull) { return hull.has(`${r},${c}`); }

// For each cell, compute which of the 4 triangle sectors to fill.
// Rule: fill a triangle if the neighbor in that direction is ALSO in the hull.
// This naturally creates: pointed nose, swept wing tips, engine nozzle splits.
function getSectors(r, c, hull) {
  return {
    top:    inHull(r - 1, c, hull),
    right:  inHull(r, c + 1, hull),
    bottom: inHull(r + 1, c, hull),
    left:   inHull(r, c - 1, hull),
  };
}

function isInterior(r, c, hull) {
  return inHull(r-1,c,hull) && inHull(r+1,c,hull) &&
         inHull(r,c-1,hull) && inHull(r,c+1,hull);
}

// ─────────────────────────────────────────────────────────────────────────────
// TRIANGLE DRAWING PRIMITIVES
// ─────────────────────────────────────────────────────────────────────────────
function tri(cx, cy, dir, color, inset) {
  const x = cx * CS, y = cy * CS;
  const p = inset || 0;
  const mx = x + CS / 2, my = y + CS / 2;
  ctx.fillStyle = color;
  ctx.beginPath();
  switch (dir) {
    case 'top':
      ctx.moveTo(x + p,      y + p);
      ctx.lineTo(x + CS - p, y + p);
      ctx.lineTo(mx,         my - p);
      break;
    case 'right':
      ctx.moveTo(x + CS - p, y + p);
      ctx.lineTo(x + CS - p, y + CS - p);
      ctx.lineTo(mx + p,     my);
      break;
    case 'bottom':
      ctx.moveTo(x + CS - p, y + CS - p);
      ctx.lineTo(x + p,      y + CS - p);
      ctx.lineTo(mx,         my + p);
      break;
    case 'left':
      ctx.moveTo(x + p,      y + CS - p);
      ctx.lineTo(x + p,      y + p);
      ctx.lineTo(mx - p,     my);
      break;
  }
  ctx.closePath();
  ctx.fill();
}

// Draw all four sectors of a hull cell in the hull color
function drawHullCell(c, r, sectors) {
  const hc = C.hull;
  const he = C.hullEdge;
  // Fill each active sector; inactive sectors stay as background
  if (sectors.top)    tri(c, r, 'top',    hc);
  if (sectors.right)  tri(c, r, 'right',  hc);
  if (sectors.bottom) tri(c, r, 'bottom', hc);
  if (sectors.left)   tri(c, r, 'left',   hc);

  // Always fill the center pixel area so no gaps appear at apex junctions
  const cx = c * CS + CS / 2 - 2, cy = r * CS + CS / 2 - 2;
  ctx.fillStyle = hc;
  ctx.fillRect(cx, cy, 4, 4);
}

// ─────────────────────────────────────────────────────────────────────────────
// MODULE COLOR ASSIGNMENT
// noseProgress: 0 = nose row, 1 = tail row
// colDist:      0 = center axis, 1 = edge
// ─────────────────────────────────────────────────────────────────────────────
function moduleColors(noseProgress, colDist) {
  // Forward-facing sector (cockpit / sensors)
  let nose;
  if (noseProgress < 0.15) nose = C.cockpit;
  else if (noseProgress < 0.45) nose = C.weapon;
  else nose = C.reactor;

  // Rear-facing sector (propulsion)
  let tail;
  if (noseProgress > 0.82) tail = C.engine;
  else if (noseProgress > 0.62) tail = C.thruster;
  else if (noseProgress > 0.4)  tail = C.reactor;
  else tail = C.weapon;

  // Side sectors (wing hardware / intakes)
  let side;
  if (colDist < 0.25)      side = C.reactor;
  else if (colDist < 0.55) side = noseProgress < 0.5 ? C.weapon  : C.reactor;
  else if (colDist < 0.8)  side = noseProgress < 0.5 ? C.intake  : C.thruster;
  else                     side = C.wing;

  return { nose, tail, side };
}

// hullBounds: { noseRow, tailRow } – actual first and last hull rows for this side
function drawModuleCell(c, r, side, hullBounds) {
  const isPlayer = side === 'player';
  const span     = Math.max(1, Math.abs(hullBounds.tailRow - hullBounds.noseRow));
  // noseP: 0 at nose-most row, 1 at tail-most row, normalized to actual ship span
  const noseP    = isPlayer
    ? (r - hullBounds.noseRow) / span
    : (hullBounds.noseRow - r) / span;
  const colDist  = Math.abs(c - 9.5) / 9.5;
  const mc       = moduleColors(Math.max(0, Math.min(1, noseP)), colDist);

  // For player: "nose-facing" sector = top; "tail-facing" = bottom
  // For enemy:  "nose-facing" sector = bottom; "tail-facing" = top
  const noseDir = isPlayer ? 'top'    : 'bottom';
  const tailDir = isPlayer ? 'bottom' : 'top';

  const pad = 4; // inset so the dark X lines show between modules
  tri(c, r, noseDir, mc.nose,  pad);
  tri(c, r, tailDir, mc.tail,  pad);
  tri(c, r, 'left',  mc.side,  pad);
  tri(c, r, 'right', mc.side,  pad);
}

// Compute actual nose-row and tail-row from a hull Set
function hullRowBounds(hull, isPlayer) {
  let noseRow = isPlayer ? 19 : 0;
  let tailRow = isPlayer ? 10 : 9;
  for (const k of hull) {
    const r = +k.split(',')[0];
    if (isPlayer) {
      if (r < noseRow) noseRow = r;
      if (r > tailRow) tailRow = r;
    } else {
      if (r > noseRow) noseRow = r;
      if (r < tailRow) tailRow = r;
    }
  }
  return { noseRow, tailRow };
}

// ─────────────────────────────────────────────────────────────────────────────
// TROOP MARKER
// ─────────────────────────────────────────────────────────────────────────────
function drawTroopMarker(c, r, side) {
  const x = c * CS + CS / 2;
  const y = r * CS + CS / 2;
  const isPlayer = side === 'player';

  // Glow
  const grd = ctx.createRadialGradient(x, y, 1, x, y, CS * 0.45);
  grd.addColorStop(0, isPlayer ? 'rgba(80,180,255,0.35)' : 'rgba(255,80,80,0.35)');
  grd.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grd;
  ctx.beginPath();
  ctx.arc(x, y, CS * 0.45, 0, Math.PI * 2);
  ctx.fill();

  // Center dot
  ctx.fillStyle = isPlayer ? '#88ccff' : '#ff8888';
  ctx.beginPath();
  ctx.arc(x, y, 3.5, 0, Math.PI * 2);
  ctx.fill();

  // Cross reticle
  ctx.strokeStyle = isPlayer ? 'rgba(100,200,255,0.7)' : 'rgba(255,100,100,0.7)';
  ctx.lineWidth = 0.8;
  ctx.beginPath();
  ctx.moveTo(x - 7, y); ctx.lineTo(x + 7, y);
  ctx.moveTo(x, y - 7); ctx.lineTo(x, y + 7);
  ctx.stroke();
}

// ─────────────────────────────────────────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────────────────────────────────────────
function render() {
  // ── Background ──────────────────────────────────────────────
  ctx.fillStyle = C.bg;
  ctx.fillRect(0, 0, CW, CH);

  // ── Grid lines ───────────────────────────────────────────────
  ctx.strokeStyle = C.gridLine;
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= G; i++) {
    ctx.beginPath(); ctx.moveTo(i * CS, 0);  ctx.lineTo(i * CS, CH); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i * CS);  ctx.lineTo(CW, i * CS); ctx.stroke();
  }

  // ── Faint X diagonals across entire grid ────────────────────
  ctx.strokeStyle = C.gridX;
  ctx.lineWidth = 0.3;
  for (let r = 0; r < G; r++) {
    for (let c = 0; c < G; c++) {
      const x = c * CS, y = r * CS;
      ctx.beginPath();
      ctx.moveTo(x, y);      ctx.lineTo(x + CS, y + CS);
      ctx.moveTo(x + CS, y); ctx.lineTo(x, y + CS);
      ctx.stroke();
    }
  }

  // ── Half-zone tints ─────────────────────────────────────────
  ctx.fillStyle = 'rgba(180,40,40,0.025)';
  ctx.fillRect(0, 0, CW, 10 * CS);
  ctx.fillStyle = 'rgba(40,120,180,0.025)';
  ctx.fillRect(0, 10 * CS, CW, 10 * CS);

  // ── HULL PASS 1 — draw hull sectors (triangle fill rule) ────
  for (const key of enemyHull) {
    const [r, c] = key.split(',').map(Number);
    drawHullCell(c, r, getSectors(r, c, enemyHull));
  }
  for (const key of playerHull) {
    const [r, c] = key.split(',').map(Number);
    drawHullCell(c, r, getSectors(r, c, playerHull));
  }

  // ── HULL PASS 2 — colored interior modules ──────────────────
  const eBounds = enemyHull.size  ? hullRowBounds(enemyHull,  false) : { noseRow: 9,  tailRow: 0 };
  const pBounds = playerHull.size ? hullRowBounds(playerHull, true)  : { noseRow: 10, tailRow: 19 };
  for (const key of enemyHull) {
    const [r, c] = key.split(',').map(Number);
    if (isInterior(r, c, enemyHull) && !enemyTroops.has(key)) {
      // draw X dividers first (black lines on top of hull, then colored inset)
      const x = c * CS, y = r * CS;
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.moveTo(x, y); ctx.lineTo(x + CS, y + CS);
      ctx.moveTo(x + CS, y); ctx.lineTo(x, y + CS);
      ctx.stroke();
      drawModuleCell(c, r, 'enemy', eBounds);
    }
  }
  for (const key of playerHull) {
    const [r, c] = key.split(',').map(Number);
    if (isInterior(r, c, playerHull) && !playerTroops.has(key)) {
      const x = c * CS, y = r * CS;
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.moveTo(x, y); ctx.lineTo(x + CS, y + CS);
      ctx.moveTo(x + CS, y); ctx.lineTo(x, y + CS);
      ctx.stroke();
      drawModuleCell(c, r, 'player', pBounds);
    }
  }

  // ── Troop markers ────────────────────────────────────────────
  for (const key of enemyTroops) {
    const [r, c] = key.split(',').map(Number);
    drawTroopMarker(c, r, 'enemy');
  }
  for (const key of playerTroops) {
    const [r, c] = key.split(',').map(Number);
    drawTroopMarker(c, r, 'player');
  }

  // ── Center divider ───────────────────────────────────────────
  ctx.strokeStyle = C.divider;
  ctx.lineWidth = 1.5;
  ctx.setLineDash([4, 6]);
  ctx.beginPath();
  ctx.moveTo(0, 10 * CS); ctx.lineTo(CW, 10 * CS);
  ctx.stroke();
  ctx.setLineDash([]);

  // Divider label
  ctx.fillStyle = '#1a3040';
  ctx.font = '9px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText('-- BATTLE LINE --', CW / 2, 10 * CS - 3);

  // ── Zone labels ───────────────────────────────────────────────
  ctx.font = '9px Courier New';
  ctx.fillStyle = '#1a1a2a';
  ctx.textAlign = 'left';
  ctx.fillText('ENEMY', 4, 12);
  ctx.textAlign = 'right';
  ctx.fillText('PLAYER', CW - 4, CH - 4);
  ctx.textAlign = 'left';

  // ── Archetype display ─────────────────────────────────────────
  document.getElementById('enemy-arch-name').textContent  = enemyArch;
  document.getElementById('player-arch-name').textContent = playerArch;
}

// ─────────────────────────────────────────────────────────────────────────────
// REGENERATE BOTH SHIPS
// ─────────────────────────────────────────────────────────────────────────────
function regen() {
  const p = generateHull(playerTroops, 'player');
  const e = generateHull(enemyTroops,  'enemy');
  playerHull  = p.hull;  playerArch  = p.archetype;
  enemyHull   = e.hull;  enemyArch   = e.archetype;
  render();
}

// ─────────────────────────────────────────────────────────────────────────────
// TROOP PLACEMENT INTERACTION
// Mirror: placing at (r, c) also places at (r, 19-c) within the same half
// ─────────────────────────────────────────────────────────────────────────────
canvas.addEventListener('mousedown', e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  // Scale to canvas coords (in case CSS scales the element)
  const scaleX = CW / rect.width;
  const scaleY = CH / rect.height;
  const c = Math.floor(mx * scaleX / CS);
  const r = Math.floor(my * scaleY / CS);
  if (c < 0 || c >= G || r < 0 || r >= G) return;

  if (r >= 10) {
    // Player half – free placement, no forced mirror
    const key = `${r},${c}`;
    if (playerTroops.has(key)) {
      playerTroops.delete(key);
    } else {
      playerTroops.add(key);
    }
    regen();
  } else {
    // Enemy half — clicking enemy side has no effect in this prototype
  }
});

// ─────────────────────────────────────────────────────────────────────────────
// BUTTON ACTIONS
// ─────────────────────────────────────────────────────────────────────────────
// Generate targeted formation patterns to produce varied archetypes
function randomTroopsForSide(side) {
  const rng      = makeRng(Date.now() & 0x7fffffff);
  const troops   = new Set();
  const rowStart = side === 'player' ? 10 : 0;

  function add(r, c) {
    if (r < 0 || r >= G || c < 0 || c >= G) return;
    troops.add(`${r},${c}`);
  }

  // addPair: places troop at (r,c) and its mirror at (r, 19-c)
  function addPair(r, c) {
    add(r, c);
    add(r, 19 - c);
  }

  const pattern = Math.floor(rng() * 6);
  switch (pattern) {
    case 0: { // FIGHTER: 2-3 troops, tight central cluster
      const dr = Math.floor(rng() * 2);
      addPair(rowStart + 1 + dr,   10 + Math.floor(rng() * 2));
      addPair(rowStart + 2 + dr,   11 + Math.floor(rng() * 2));
      if (rng() > 0.5)
        addPair(rowStart + 3 + dr, 12 + Math.floor(rng() * 2));
      break;
    }
    case 1: { // DRONE: wide troops at same depth → arm drone
      const d = Math.floor(rng() * 3);
      addPair(rowStart + 2 + d, 14 + Math.floor(rng() * 3));
      break;
    }
    case 2: { // DELTA / B2: triangle widening with depth
      addPair(rowStart + 1, 10);
      addPair(rowStart + 2, 11 + Math.floor(rng() * 2));
      addPair(rowStart + 3, 13 + Math.floor(rng() * 2));
      break;
    }
    case 3: { // ROCKET: narrow vertical column
      const col = 10 + Math.floor(rng() * 2);
      const len = 3 + Math.floor(rng() * 4);
      for (let i = 0; i < len; i++) addPair(rowStart + 1 + i, col);
      break;
    }
    case 4: { // WING: wide troops at different depths → swept flying wing
      const d = Math.floor(rng() * 2);
      addPair(rowStart + 1 + d, 15 + Math.floor(rng() * 3));
      addPair(rowStart + 2 + d, 13 + Math.floor(rng() * 2));
      break;
    }
    case 5: { // BOMBER: troops at medium width, squat silhouette
      const base = rowStart + 1 + Math.floor(rng() * 2);
      const col  = 12 + Math.floor(rng() * 2);
      addPair(base,     col);
      addPair(base + 1, col + Math.floor(rng() * 2));
      addPair(base + 2, col - Math.floor(rng() * 2));
      break;
    }
  }
  return troops;
}

function randomizePlayer() {
  playerTroops = randomTroopsForSide('player');
  regen();
}
function randomizeEnemy() {
  enemyTroops = randomTroopsForSide('enemy');
  regen();
}
function clearPlayer() {
  playerTroops.clear();
  regen();
}
function clearAll() {
  playerTroops.clear();
  enemyTroops.clear();
  regen();
}

// ─────────────────────────────────────────────────────────────────────────────
// INITIAL STATE — player=DELTA/B2 showcase, enemy=DRONE showcase
// ─────────────────────────────────────────────────────────────────────────────
(function init() {
  // Player: triangle formation → DELTA / B2 bomber silhouette
  // Troops widen with depth: narrow at nose (row 10), very wide at tail
  [
    [11, 10],          // nose pair (mirrored → cols 9,10)
    [12, 12],          // mid pair
    [13, 14],          // wide pair → gives deltaScore=1.0 → DELTA
  ].forEach(([r, c]) => {
    playerTroops.add(`${r},${c}`);
    playerTroops.add(`${r},${19 - c}`);
  });

  // Enemy: 2 wide-spread troops at same depth → DRONE with arm wings
  [
    [7, 15],           // one far-out pair
  ].forEach(([r, c]) => {
    enemyTroops.add(`${r},${c}`);
    enemyTroops.add(`${r},${19 - c}`);
  });

  regen();
})();
</script>
