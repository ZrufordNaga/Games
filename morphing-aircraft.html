// ─── Canvas ───────────────────────────────────────────────────────────────────

let W = 0, H = 0;
function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
resize();

// ─── Mesh density ─────────────────────────────────────────────────────────────
const NS = 52;   // longitudinal slices
const NR = 26;   // radial segments per ring
const BODY_LEN = 5.0;

// ─── Timing ───────────────────────────────────────────────────────────────────
const HOLD_S  = 0.85;   // seconds to hold a shape
const TRANS_S = 0.80;   // seconds to morph to next (fast snap)
const PHASE_S = HOLD_S + TRANS_S;   // per-shape cycle

// ─── Helpers ──────────────────────────────────────────────────────────────────
const lerp   = (a, b, t) => a + (b - a) * t;
const clamp  = (x, lo, hi) => x < lo ? lo : x > hi ? hi : x;
const smooth = t => t * t * (3 - 2 * t);   // smoothstep (used for camera)
// Morph easing: ease-out power — starts fast, settles to destination.
// More decisive than smoothstep; intermediate shapes flash by rather than linger.
const morphEase = t => 1 - Math.pow(1 - t, 2.5);

// Catmull-Rom spline (clamped at ends)
function catmullRom(p0, p1, p2, p3, t) {
  const t2 = t * t, t3 = t2 * t;
  return 0.5 * (
    2 * p1 +
    t  * (-p0 + p2) +
    t2 * (2 * p0 - 5 * p1 + 4 * p2 - p3) +
    t3 * (-p0 + 3 * p1 - 3 * p2 + p3)
  );
}

// ─── Shape definitions ────────────────────────────────────────────────────────
// Profile waypoints: { t, rx, ry, fl, tb }
//   t  = position along body (0 = nose, 1 = tail)
//   rx = half-width  (X)
//   ry = half-height (Y)
//   fl = horizontal wing flare (extra X extension, peaks at equator)
//   tb = top-bulge: dorsal spine/cockpit ridge (peaks at top surface)
// Shapes use BODY_LEN = 5 world units. Scale chosen so widest shape
// (≈ rx+fl ≈ 2.4) fills comfortably within screen at default zoom.
function p(t, rx, ry, fl = 0, tb = 0) { return { t, rx, ry, fl, tb }; }

    ]},

  { name: 'F-15 Eagle', col: [185, 140, 80],
    profile: [

      p(0.68, 0.22, 0.15, 0.22, 0.06),

    ]},
];
const N_SHAPES = SHAPES.length;

// ─── Profile sampling (Catmull-Rom) ──────────────────────────────────────────
function sampleProfile(profile, t, key) {
  const n = profile.length;
  if (t <= profile[0].t)     return profile[0][key]     || 0;
  if (t >= profile[n-1].t)   return profile[n-1][key]   || 0;

  // Find surrounding segment
  let i = 1;
  while (i < n - 1 && profile[i].t < t) i++;
  const seg = (t - profile[i-1].t) / (profile[i].t - profile[i-1].t);

  const v0 = profile[Math.max(0, i-2)][key]     || 0;
  const v1 = profile[i-1][key]                  || 0;
  const v2 = profile[i][key]                    || 0;
  const v3 = profile[Math.min(n-1, i+1)][key]   || 0;
  return Math.max(0, catmullRom(v0, v1, v2, v3, seg));
}

// ─── Cross-section point ──────────────────────────────────────────────────────
// Returns (x, y) at radial angle `a` for given profile params.
// Wing flare: extra width peaking at equator. tb: extra upward dorsal bulge.
function csPoint(rx, ry, fl, tb, a) {
  const ca = Math.cos(a), sa = Math.sin(a);
  const flare   = fl * Math.pow(Math.abs(ca), 2.5);
  // topBulge rises only on the dorsal (sa > 0) side, smooth cubic falloff
  const topBulge = tb * Math.max(0, sa) * Math.pow(sa, 2.0);
  return [(rx + flare) * ca, ry * sa + topBulge];
}

// ─── Control points ───────────────────────────────────────────────────────────
const N_CP       = 6;
const cpDelta    = new Float32Array(N_CP);   // added rx offset at each CP station
let   selCP      = 0;

// ─── Static triangle topology ────────────────────────────────────────────────
// Vertices: (NS+1) rings of NR radial pts + noseCap + tailCap
const nVerts  = (NS + 1) * NR + 2;
const noseCap = (NS + 1) * NR;
const tailCap = noseCap + 1;

// Two body tris per quad + NR cap tris at each end
const nTris = NS * NR * 2 + NR * 2;
const TRIS  = new Int32Array(nTris * 3);
(function buildTopology() {
  let ti = 0;
  // Body quads → two CCW triangles (outward normal when viewed from outside)
  for (let s = 0; s < NS; s++) {
    for (let r = 0; r < NR; r++) {
      const r2  = (r + 1) % NR;
      const v00 = s * NR + r;
      const v01 = s * NR + r2;
      const v10 = (s + 1) * NR + r;
      const v11 = (s + 1) * NR + r2;
      // Verified CCW from outside → outward normal
      TRIS[ti++] = v00; TRIS[ti++] = v01; TRIS[ti++] = v11;
      TRIS[ti++] = v00; TRIS[ti++] = v11; TRIS[ti++] = v10;
    }
  }
  // Nose fan — cap at −Z end, normal → −Z (toward front of craft)
  for (let r = 0; r < NR; r++) {
    TRIS[ti++] = noseCap; TRIS[ti++] = (r + 1) % NR; TRIS[ti++] = r;
  }
  // Tail fan — cap at +Z end, normal → +Z (toward back of craft)
  const tb = NS * NR;
  for (let r = 0; r < NR; r++) {
    TRIS[ti++] = tailCap; TRIS[ti++] = tb + r; TRIS[ti++] = tb + (r + 1) % NR;
  }
})();

// ─── Per-frame geometry arrays ────────────────────────────────────────────────
const vx  = new Float32Array(nVerts); // world position
const vy  = new Float32Array(nVerts);
const vz  = new Float32Array(nVerts);
const tvx = new Float32Array(nVerts); // after rotation
const tvy = new Float32Array(nVerts);
const tvz = new Float32Array(nVerts);
const spx = new Float32Array(nVerts); // screen coords
const spy = new Float32Array(nVerts);

// ─── Geometry update (runs each frame) ───────────────────────────────────────
function updateGeometry(iA, iB, alpha) {
  const pA = SHAPES[iA].profile;
  const pB = SHAPES[iB].profile;
  function get(key, t) {
    return lerp(sampleProfile(pA, t, key), sampleProfile(pB, t, key), alpha);
  }

  for (let s = 0; s <= NS; s++) {
    const t  = s / NS;
    const z  = (t - 0.5) * BODY_LEN;
    let   rx = get('rx', t);
    const ry = get('ry', t);
    const fl = get('fl', t);
    const tb = get('tb', t);

    // Control-point override (blended along body)
    const cpF = t * (N_CP - 1);
    const cp0 = Math.floor(cpF);
    const cp1 = Math.min(cp0 + 1, N_CP - 1);
    const cpA = cpF - cp0;
    const delta = lerp(cpDelta[cp0], cpDelta[cp1], cpA) * 0.12;
    rx = Math.max(0, rx + delta);

    for (let r = 0; r < NR; r++) {
      const a   = (r / NR) * Math.PI * 2;
      const [x, y] = csPoint(rx, ry, fl, tb, a);
      const vi  = s * NR + r;
      vx[vi] = x; vy[vi] = y; vz[vi] = z;
    }
  }

  // Caps — slightly beyond the end rings so the fan forms a short rounded nub
  // rather than collapsing flat. The end rings have a small nonzero radius
  // (from the profile waypoints), and the cap sits 0.12 units further out,
  // giving a gently blunted tip that is not a spike and not a flat disk.
  vx[noseCap] = 0; vy[noseCap] = 0; vz[noseCap] = -BODY_LEN * 0.5 - 0.12;
  vx[tailCap] = 0; vy[tailCap] = 0; vz[tailCap] =  BODY_LEN * 0.5 + 0.12;
}

// ─── Camera state ─────────────────────────────────────────────────────────────
let rotYaw   =  0.25;
let rotPitch =  0.22;
let zoom     =  1.0;
let autoRot  =  true;
const AUTO_SPEED = 0.38;   // rad/sec

// ─── Transform + project ─────────────────────────────────────────────────────
const CAM_DIST  = 9.0;
const FOV_SCALE = CAM_DIST;  // perspective focal length = camDist → ~53° FOV

function transformAndProject() {
  const cy = Math.cos(rotYaw),   sy = Math.sin(rotYaw);
  const cp = Math.cos(rotPitch), sp = Math.sin(rotPitch);
  // Rotation = Rx(pitch) * Ry(yaw)
  // [ cy,      0,   -sy    ]
  // [ sy*sp,  cp,   cy*sp  ]
  // [ sy*cp, -sp,   cy*cp  ]

  const scale = Math.min(W, H) * 0.19 * zoom;
  const cx    = W * 0.5, cy2 = H * 0.5;

  for (let i = 0; i < nVerts; i++) {
    const x = vx[i], y = vy[i], z = vz[i];
    const rx =  cy * x            - sy * z;
    const ry =  sy * sp * x + cp * y + cy * sp * z;
    const rz =  sy * cp * x - sp * y + cy * cp * z;
    tvx[i] = rx; tvy[i] = ry; tvz[i] = rz;

    // Perspective divide
    const d = FOV_SCALE / (rz + CAM_DIST);
    spx[i] = cx + rx * d * scale;
    spy[i] = cy2 - ry * d * scale;
  }
}

// ─── Render ───────────────────────────────────────────────────────────────────
// Light direction: beam direction FROM light TO scene (view-space, fixed).
// (0.50, -0.70, 0.50) → light is above-left-front of camera, illuminates TOP surface.
const LIGHT = (() => {
  const v = [0.50, -0.70, 0.50];
  const m = Math.hypot(...v);
  return v.map(x => x / m);
})();

// Reusable triangle sort array (avoid GC)
const sortBuf = new Float64Array(nTris);   // depth per triangle
const triOrder = new Int32Array(nTris);    // index order after sort

function render(iA, iB, alpha) {
  // ── Background: deep space gradient ───────────────────────────────────────
  const bgGrad = ctx.createRadialGradient(W * 0.5, H * 0.42, 0, W * 0.5, H * 0.5, Math.max(W, H) * 0.75);
  bgGrad.addColorStop(0,   '#0c1228');
  bgGrad.addColorStop(0.55, '#060812');
  bgGrad.addColorStop(1,    '#020308');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  // ── Blended base color ─────────────────────────────────────────────────────
  const cA = SHAPES[iA].col, cB = SHAPES[iB].col;
  const bR = lerp(cA[0], cB[0], alpha);
  const bG = lerp(cA[1], cB[1], alpha);
  const bBc = lerp(cA[2], cB[2], alpha);

  const lx = LIGHT[0], ly = LIGHT[1], lz = LIGHT[2];
  let visCount = 0;

  // ── Back-face cull + depth collect ────────────────────────────────────────
  for (let i = 0; i < nTris; i++) {
    const i0 = TRIS[i*3], i1 = TRIS[i*3+1], i2 = TRIS[i*3+2];
    const ax = tvx[i1]-tvx[i0], ay = tvy[i1]-tvy[i0], az = tvz[i1]-tvz[i0];
    const bx = tvx[i2]-tvx[i0], by = tvy[i2]-tvy[i0], bz = tvz[i2]-tvz[i0];
    const nz = ax*by - ay*bx;
    const nl2 = (ay*bz-az*by)**2 + (az*bx-ax*bz)**2 + nz*nz;
    if (nl2 < 1e-18 || nz > 0) continue;
    sortBuf[visCount]  = (tvz[i0] + tvz[i1] + tvz[i2]) / 3;
    triOrder[visCount] = i;
    visCount++;
  }

  // Painter's algorithm: farthest first
  const visible = Array.from({length: visCount}, (_, k) => k);
  visible.sort((a, b) => sortBuf[b] - sortBuf[a]);

  // ── Shadow pass: tight offset copy above the aircraft ────────────────────
  // Shadow sits slightly above-and-behind (light from below-front), fitting
  // closely to the silhouette so it reads as an intimate contact shadow.
  const sMin = Math.min(W, H);
  const sDX =  sMin * 0.018;   // slight rightward offset
  const sDY = -sMin * 0.032;   // upward (above the body)
  ctx.save();
  ctx.globalAlpha = 0.28;
  ctx.fillStyle = '#000408';
  for (let vi = 0; vi < visCount; vi++) {
    const i  = triOrder[visible[vi]];
    const i0 = TRIS[i*3], i1 = TRIS[i*3+1], i2 = TRIS[i*3+2];
    ctx.beginPath();
    ctx.moveTo(spx[i0]+sDX, spy[i0]+sDY);
    ctx.lineTo(spx[i1]+sDX, spy[i1]+sDY);
    ctx.lineTo(spx[i2]+sDX, spy[i2]+sDY);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();

  // ── Main shading pass ─────────────────────────────────────────────────────
  // Half-vector for Blinn-Phong: H = normalize(V + L)
  //   V = (0,0,-1) toward camera, L = (-lx,-ly,-lz) toward light
  //   H = normalize(-lx, -ly, -lz-1)
  const hvx = -lx, hvy = -ly, hvz = -lz - 1.0;
  const hvm = Math.sqrt(hvx*hvx + hvy*hvy + hvz*hvz);

  for (let vi = 0; vi < visCount; vi++) {
    const i  = triOrder[visible[vi]];
    const i0 = TRIS[i*3], i1 = TRIS[i*3+1], i2 = TRIS[i*3+2];

    // Face normal (recompute from view-space verts)
    const ax = tvx[i1]-tvx[i0], ay = tvy[i1]-tvy[i0], az = tvz[i1]-tvz[i0];
    const bx = tvx[i2]-tvx[i0], by = tvy[i2]-tvy[i0], bz = tvz[i2]-tvz[i0];
    const nx = ay*bz - az*by;
    const ny = az*bx - ax*bz;
    const nz = ax*by - ay*bx;
    const nl = Math.sqrt(nx*nx + ny*ny + nz*nz);
    const nnx = nx/nl, nny = ny/nl, nnz = nz/nl;

    // Key diffuse (Lambert)
    const diff = Math.max(0, -(nnx*lx + nny*ly + nnz*lz));

    // Hemisphere ambient: top faces (nny > 0 in view-space = facing sky) get a
    // cool blue-grey tint; bottom faces stay very dark.
    const hemi = (nny + 1) * 0.5;                 // 0 = down, 1 = up

    // Rim light: silhouette edges (nnz ≈ 0) glow with a cool backlight.
    // Modulated so only top/upper faces rim-glow (not underbelly).
    const rim = Math.pow(Math.max(0, 1 - Math.abs(nnz)), 4.5) *
                Math.max(0, 0.3 + nny * 0.7) * 0.62;

    // Specular (Blinn-Phong)
    const spec = Math.pow(Math.max(0, (nnx*hvx + nny*hvy + nnz*hvz) / hvm), 38) * 0.62;

    // Combine
    const amb = 0.06 + hemi * 0.14;   // 0.06 (underside) … 0.20 (top)
    const tot = amb + 0.72 * diff;
    const r = clamp(Math.round(bR  * tot + rim * 88  + spec * 115), 0, 255);
    const g = clamp(Math.round(bG  * tot + rim * 108 + spec * 115), 0, 255);
    const b = clamp(Math.round(bBc * tot + rim * 145 + spec * 115), 0, 255);

    ctx.beginPath();
    ctx.moveTo(spx[i0], spy[i0]);
    ctx.lineTo(spx[i1], spy[i1]);
    ctx.lineTo(spx[i2], spy[i2]);
    ctx.closePath();
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    ctx.fill();

    // Thin seam darkening — fills micro-gaps and gives the mesh solidity
    ctx.strokeStyle = 'rgba(0,0,0,0.20)';
    ctx.lineWidth   = 0.5;
    ctx.stroke();
  }

  drawCPMarkers();
}

// ─── Control-point markers ────────────────────────────────────────────────────
function drawCPMarkers() {
  for (let cp = 0; cp < N_CP; cp++) {
    const t    = cp / (N_CP - 1);
    const sIdx = Math.round(t * NS);
    // Find topmost screen-space point in this ring
    let topY = Infinity, topX = 0;
    for (let r = 0; r < NR; r++) {
      const vi = sIdx * NR + r;
      if (spy[vi] < topY) { topY = spy[vi]; topX = spx[vi]; }
    }
    const sel = cp === selCP;
    ctx.beginPath();
    ctx.arc(topX, topY - 7, sel ? 7 : 5, 0, Math.PI * 2);
    ctx.fillStyle   = sel ? '#ffe040' : 'rgba(100,140,200,.7)';
    ctx.fill();
    ctx.strokeStyle = sel ? '#fff' : 'rgba(80,120,180,.5)';
    ctx.lineWidth   = sel ? 1.5 : 1;
    ctx.stroke();
  }
}

// ─── HUD update ───────────────────────────────────────────────────────────────
const hud = document.getElementById('hud');
function updateHUD(iA, iB, alpha) {
  const pct = Math.round(alpha * 100);
  hud.innerHTML =
    `<span class="hl">${SHAPES[iA].name}</span><br>` +
    `<span class="dim">→ </span>${SHAPES[iB].name}<br>` +
    `<span class="dim">morph</span> ${pct}%` +
    `<span class="bar"><span style="width:${pct}%"></span></span><br>` +
    `<span class="dim">──────────────────</span><br>` +
    `<span class="hl">CP ${selCP+1}/${N_CP}</span>` +
    ` <span class="dim">Δ=${(cpDelta[selCP]*0.12).toFixed(2)}</span><br>` +
    `<span class="dim">──────────────────</span><br>` +
    `<b>drag</b> rotate &nbsp; <b>scroll</b> zoom<br>` +
    `<b>R</b> auto-rotate (${autoRot?'on':'off'})<br>` +
    `<b>Tab / ← →</b> select CP<br>` +
    `<b>↑ ↓</b> widen / narrow CP<br>` +
    `<b>0</b> reset all CPs`;
}

// ─── Input handling ───────────────────────────────────────────────────────────
let dragging = false, lastMX = 0, lastMY = 0;

canvas.addEventListener('mousedown', e => {
  dragging = true;
  lastMX = e.clientX; lastMY = e.clientY;
  canvas.classList.add('drag');
});
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  rotYaw   += (e.clientX - lastMX) * 0.007;
  rotPitch += (e.clientY - lastMY) * 0.007;
  rotPitch  = clamp(rotPitch, -1.4, 1.4);
  lastMX = e.clientX; lastMY = e.clientY;
});
window.addEventListener('mouseup', () => { dragging = false; canvas.classList.remove('drag'); });

canvas.addEventListener('wheel', e => {
  zoom *= e.deltaY > 0 ? 0.92 : 1.09;
  zoom  = clamp(zoom, 0.18, 5);
  e.preventDefault();
}, { passive: false });

// Touch
let tDrag = false, tLastX = 0, tLastY = 0, tPinch = 0;
canvas.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    tDrag = true; tLastX = e.touches[0].clientX; tLastY = e.touches[0].clientY;
  } else if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    tPinch = Math.hypot(dx, dy);
  }
  e.preventDefault();
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  if (e.touches.length === 1 && tDrag) {
    rotYaw   += (e.touches[0].clientX - tLastX) * 0.008;
    rotPitch += (e.touches[0].clientY - tLastY) * 0.008;
    rotPitch  = clamp(rotPitch, -1.4, 1.4);
    tLastX = e.touches[0].clientX; tLastY = e.touches[0].clientY;
  } else if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const d  = Math.hypot(dx, dy);
    if (tPinch > 0) { zoom *= d / tPinch; zoom = clamp(zoom, 0.18, 5); }
    tPinch = d;
  }
  e.preventDefault();
}, { passive: false });
canvas.addEventListener('touchend', () => { tDrag = false; });

window.addEventListener('keydown', e => {
  switch (e.key) {
    case 'Tab':
      e.preventDefault();
      selCP = (selCP + (e.shiftKey ? N_CP - 1 : 1)) % N_CP;
      break;
    case 'ArrowLeft':
      if (!e.ctrlKey && !e.metaKey) {
        selCP = (selCP + N_CP - 1) % N_CP;
        e.preventDefault();
      }
      break;
    case 'ArrowRight':
      if (!e.ctrlKey && !e.metaKey) {
        selCP = (selCP + 1) % N_CP;
        e.preventDefault();
      }
      break;
    case 'ArrowUp':
      cpDelta[selCP] = clamp(cpDelta[selCP] + 1, -4, 16);
      e.preventDefault();
      break;
    case 'ArrowDown':
      cpDelta[selCP] = clamp(cpDelta[selCP] - 1, -4, 16);
      e.preventDefault();
      break;
    case 'r': case 'R':
      autoRot = !autoRot;
      break;
    case '0':
      cpDelta.fill(0);
      break;
  }
});

// ─── Animation loop ───────────────────────────────────────────────────────────
let t0 = null;

function frame(ts) {
  if (!t0) t0 = ts;
  const elapsed = (ts - t0) / 1000;

  // Auto-rotate
  if (autoRot) rotYaw += AUTO_SPEED / 60;

  // Morph state
  const totalCycle = PHASE_S * N_SHAPES;
  const phase      = elapsed % totalCycle;
  const shapePhase = phase / PHASE_S;
  const iA         = Math.floor(shapePhase) % N_SHAPES;
  const iB         = (iA + 1) % N_SHAPES;
  const localPhase = shapePhase - Math.floor(shapePhase);
  const holdFrac   = HOLD_S / PHASE_S;
  const alpha      = localPhase < holdFrac
    ? 0
    : morphEase((localPhase - holdFrac) / (1 - holdFrac));

  updateGeometry(iA, iB, alpha);
  transformAndProject();
  render(iA, iB, alpha);
  updateHUD(iA, iB, alpha);

  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);
</script>
</body>
</html>
