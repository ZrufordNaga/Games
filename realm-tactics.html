<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚔️ Realm Tactics</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d1117;color:#e0e0e0;font-family:'Segoe UI',Tahoma,sans-serif;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px 6px;user-select:none}
h1{font-size:26px;color:#ffd700;letter-spacing:3px;margin-bottom:6px;text-shadow:0 0 20px rgba(255,215,0,.4)}
#phase-banner{font-size:14px;font-weight:bold;padding:5px 24px;border-radius:20px;margin-bottom:8px;
  border:2px solid #ffd700;color:#ffd700;min-height:30px;text-align:center;min-width:400px}

/* ── LAYOUT ─────────────────────────────────── */
#game-wrapper{display:flex;gap:14px;align-items:flex-start}

/* ── HUD ─────────────────────────────────────── */
.hud-bar{width:566px;display:flex;align-items:center;padding:8px 14px;border-radius:8px;font-size:13px;gap:10px}
#hud-red {background:rgba(140,20,20,.40);border:2px solid rgba(220,60,60,.6)}
#hud-blue{background:rgba(20,50,150,.40);border:2px solid rgba(60,100,230,.6)}
.hud-name{font-weight:bold;font-size:14px;min-width:80px}
#hud-red  .hud-name{color:#ff8888}
#hud-blue .hud-name{color:#88aaff}
.hud-hp-wrap{flex:1;display:flex;flex-direction:column;gap:2px}
.hud-hp-bar{height:14px;background:rgba(0,0,0,.45);border-radius:7px;overflow:hidden}
.hud-hp-fill{height:100%;border-radius:7px;transition:width .35s,background .35s}
.hud-hp-text{font-size:10px;color:#bbb;text-align:center}
.hud-count{font-size:13px;font-weight:bold;min-width:52px;text-align:right}

/* ── BOARD CONTAINER ─────────────────────────── */
#board-wrap{position:relative;display:inline-block}

/* ── BOARD GRID ──────────────────────────────── */
#board{display:grid;grid-template-columns:repeat(8,70px);grid-template-rows:repeat(8,70px);
  border:3px solid #111;border-radius:4px;box-shadow:0 6px 32px rgba(0,0,0,.8)}
.cell{width:70px;height:70px;position:relative;display:flex;align-items:center;justify-content:center}

/* Neutral fallback (unused with full-zone board) */
.cell.light{background:#d4c080}.cell.dark{background:#6e8850}

/* Red zone rows 0-3: warm tones */
.cell.zr.light{background:#e8b870}
.cell.zr.dark {background:#9a3322}
/* Red base/wall row (row 0): fortress back */
.cell.base-r.light{background:#b86030}
.cell.base-r.dark {background:#581008}

/* Blue zone rows 4-7: cool tones */
.cell.zb.light{background:#88b8e0}
.cell.zb.dark {background:#1e3a99}
/* Blue base/wall row (row 7): fortress back */
.cell.base-b.light{background:#3060b8}
.cell.base-b.dark {background:#081058}

/* Centre battle line */
.cell.ctr-top   {border-bottom:4px solid rgba(255,240,80,.45)!important}
.cell.ctr-bottom{border-top   :4px solid rgba(255,240,80,.45)!important}

/* ── PIECES ──────────────────────────────────── */
.piece{width:64px;height:64px;border-radius:8px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1px;border:2px solid transparent;position:relative}
.piece.red-pc{background:linear-gradient(145deg,#aa2828,#dd4444);border-color:#ff9090;
  box-shadow:0 2px 8px rgba(200,40,40,.6)}
.piece.blue-pc{background:linear-gradient(145deg,#1e3488,#3a5acc);border-color:#88aaff;
  box-shadow:0 2px 8px rgba(40,70,200,.6)}
/* Flash animations */
.piece.flash-atk{animation:fAtk .25s ease}
.piece.flash-hit{animation:fHit .35s ease}
@keyframes fAtk{0%{filter:brightness(1)}40%{filter:brightness(3.5)saturate(2.5)}100%{filter:brightness(1)}}
@keyframes fHit{0%{filter:brightness(1)}35%{filter:brightness(2.5)saturate(.1)sepia(1)}100%{filter:brightness(1)}}
/* Piece appear during setup */
@keyframes pieceIn{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
.piece-enter{animation:pieceIn .22s ease-out both}

.piece-icon{font-size:24px;line-height:1}
.piece-lbl{font-size:7px;color:rgba(255,255,255,.9);max-width:62px;text-align:center;
  white-space:nowrap;overflow:hidden}
.hp-bar{width:56px;height:5px;background:rgba(0,0,0,.5);border-radius:3px;overflow:hidden;margin-top:2px}
.hp-fill{height:100%;border-radius:3px;transition:width .25s}
.status-dot{position:absolute;top:-5px;right:-5px;font-size:10px;background:rgba(0,0,0,.8);
  border-radius:3px;padding:1px 2px;line-height:1}

/* ── SVG OVERLAY (attack trails + alliance lines) ── */
#lines-svg{position:absolute;top:3px;left:3px;width:560px;height:560px;pointer-events:none;z-index:20;overflow:visible}

/* ── CONTROLS ────────────────────────────────── */
#controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px;width:566px}
.btn{padding:8px 18px;border:none;border-radius:7px;font-size:13px;font-weight:bold;cursor:pointer;transition:all .15s}
#btn-start{background:#22aa44;color:#fff;font-size:15px;padding:10px 28px;display:none;
  box-shadow:0 0 16px rgba(40,200,80,.4)}
#btn-start:hover{background:#33cc55}
#btn-reset{background:#444;color:#ddd}
#btn-reset:hover{background:#555}
#speed-label{font-size:12px;color:#888;margin-left:6px;display:none}
.spd-btn{padding:5px 12px;border:none;border-radius:5px;font-size:12px;font-weight:bold;cursor:pointer;
  background:#2a2a2a;color:#aaa;border:1px solid #333;transition:all .1s;display:none}
.spd-btn.active{background:#ffd700;color:#000;border-color:#ffd700}
#tick-count{font-size:11px;color:#555;margin-left:auto;display:none}

/* ── RIGHT PANEL ─────────────────────────────── */
#right-panel{width:230px;display:flex;flex-direction:column;gap:10px}
.panel-box{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:10px}
.panel-title{font-size:13px;font-weight:bold;color:#ffd700;margin-bottom:8px;text-align:center}
#legend-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.leg-item{background:rgba(255,255,255,.05);border-radius:5px;padding:3px 2px;text-align:center;cursor:default;
  border:1px solid transparent;transition:border-color .1s}
.leg-item:hover{border-color:#ffd700}
.leg-icon{font-size:16px;line-height:1.3}.leg-name{font-size:7px;color:#999;line-height:1.2}
#info-box{font-size:12px;min-height:80px}
.info-row{display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.info-desc{font-size:11px;color:#999;margin-top:6px;line-height:1.45}
.special-tag{display:inline-block;margin-top:5px;padding:1px 6px;background:rgba(255,200,0,.15);
  border:1px solid rgba(255,200,0,.35);border-radius:3px;font-size:10px;color:#ffd700}
#log-box{max-height:210px;overflow-y:auto;font-size:11px;line-height:1.65;color:#888}
#log-box::-webkit-scrollbar{width:4px}
#log-box::-webkit-scrollbar-thumb{background:#333;border-radius:2px}
.log-r{color:#ff9090}.log-b{color:#90aaff}.log-s{color:#ffd700}

/* ── WIN OVERLAY ─────────────────────────────── */
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.86);z-index:99;
  align-items:center;justify-content:center;flex-direction:column;gap:18px}
#overlay.show{display:flex}
#win-text{font-size:52px;color:#ffd700;text-shadow:0 0 40px #ffd700}
#win-sub{font-size:18px;color:#eee}
#win-stats{font-size:14px;color:#aaa;text-align:center;line-height:1.8}
</style>
</head>
<body>

<h1>⚔️ REALM TACTICS ⚔️</h1>
<div id="phase-banner">Initialising...</div>

<div id="game-wrapper">
  <div id="board-area">
    <div class="hud-bar" id="hud-red">
      <span class="hud-name">🔴 RED BASE</span>
      <div class="hud-hp-wrap">
        <div class="hud-hp-bar"><div class="hud-hp-fill" id="hp-fill-red" style="width:100%;background:#44dd44"></div></div>
        <div class="hud-hp-text" id="hp-text-red">— HP</div>
      </div>
      <span class="hud-count" id="count-red">♟ —</span>
    </div>

    <div id="board-wrap">
      <div id="board"></div>
      <svg id="lines-svg" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="glow-r" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <filter id="glow-b" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
      </svg>
    </div>

    <div class="hud-bar" id="hud-blue">
      <span class="hud-name">🔵 BLUE BASE</span>
      <div class="hud-hp-wrap">
        <div class="hud-hp-bar"><div class="hud-hp-fill" id="hp-fill-blue" style="width:100%;background:#44dd44"></div></div>
        <div class="hud-hp-text" id="hp-text-blue">— HP</div>
      </div>
      <span class="hud-count" id="count-blue">♟ —</span>
    </div>

    <div id="controls">
      <button class="btn" id="btn-start" onclick="startBattle()">⚔️ Start Battle!</button>
      <button class="btn" id="btn-reset" onclick="resetGame()">🔄 New Battle</button>
      <span id="speed-label">Speed:</span>
      <button class="spd-btn active" id="spd1" onclick="setSpeed(600,this)">1×</button>
      <button class="spd-btn"        id="spd2" onclick="setSpeed(300,this)">2×</button>
      <button class="spd-btn"        id="spd4" onclick="setSpeed(150,this)">4×</button>
      <span id="tick-count">Tick 0</span>
    </div>
  </div>

  <div id="right-panel">
    <div class="panel-box">
      <div class="panel-title">📋 Piece Info</div>
      <div id="info-box"><p style="color:#555;font-size:11px;text-align:center;padding-top:10px">Hover a piece</p></div>
    </div>
    <div class="panel-box">
      <div class="panel-title">📖 Piece Legend</div>
      <div id="legend-grid"></div>
    </div>
    <div class="panel-box">
      <div class="panel-title">📜 Battle Log</div>
      <div id="log-box"></div>
    </div>
  </div>
</div>

<div id="overlay">
  <div id="win-text">Winner!</div>
  <div id="win-sub"></div>
  <div id="win-stats"></div>
  <button class="btn" style="background:#ffd700;color:#000;font-size:15px;padding:10px 30px"
          onclick="resetGame()">🔄 New Battle</button>
</div>

<script>
// ═══════════════════════════════════════════════════════
//  PIECE DEFINITIONS
// ═══════════════════════════════════════════════════════
const PDEFS = {
  footman:     {name:'Footman',       icon:'⚔️',  maxHp:50,  atk:12, range:1, spd:2, special:null,           desc:'Reliable melee fighter.'},
  archer:      {name:'Archer',        icon:'🏹',  maxHp:30,  atk:14, range:3, spd:2, special:null,           desc:'Ranged. Attacks from up to 3 tiles away.'},
  knight:      {name:'Knight',        icon:'🐴',  maxHp:70,  atk:20, range:1, spd:2, special:'fast',         desc:'Heavy cavalry — tough melee fighter.'},
  mage:        {name:'Mage',          icon:'🔮',  maxHp:25,  atk:28, range:4, spd:3, special:'aoe',          desc:'Hits main target AND one nearby enemy.'},
  healer:      {name:'Healer',        icon:'💚',  maxHp:28,  atk:8,  range:2, spd:2, special:'heal',         desc:'Heals the lowest-HP ally (20 HP) instead of attacking.'},
  shieldbearer:{name:'Shield Bearer', icon:'🛡️',  maxHp:100, atk:10, range:1, spd:3, special:'armor',        desc:'Takes only 50% damage from all sources.'},
  ballista:    {name:'Ballista',      icon:'🎯',  maxHp:20,  atk:45, range:5, spd:4, special:'immobile',     desc:'Stationary. Extreme range and power.'},
  berserker:   {name:'Berserker',     icon:'🪓',  maxHp:55,  atk:22, range:1, spd:1, special:'double',       desc:'Attacks twice per turn.'},
  monk:        {name:'Monk',          icon:'☯️',  maxHp:40,  atk:16, range:1, spd:2, special:'counter',      desc:'Reflects 40% of incoming damage back.'},
  pyromancer:  {name:'Pyromancer',    icon:'🔥',  maxHp:28,  atk:18, range:3, spd:2, special:'burn',         desc:'Burns target: 3 dmg/tick for 4 ticks.'},
  golem:       {name:'Golem',         icon:'🗿',  maxHp:140, atk:15, range:1, spd:4, special:'rangedImmune', desc:'Immune to attacks from range > 1.'},
  assassin:    {name:'Assassin',      icon:'🗡️',  maxHp:28,  atk:40, range:1, spd:2, special:'bypass',       desc:'Ignores target armor.'},
  shaman:      {name:'Shaman',        icon:'🌿',  maxHp:35,  atk:13, range:3, spd:2, special:'poison',       desc:'Poisons target: 4 dmg/tick for 4 ticks.'},
  dragon:      {name:'Dragon',        icon:'🐉',  maxHp:90,  atk:30, range:2, spd:3, special:'cleave',       desc:'Hits ALL enemies in range simultaneously.'},
  bard:        {name:'Bard',          icon:'🎵',  maxHp:22,  atk:10, range:2, spd:2, special:'buff',         desc:'+10 attack to all adjacent allies each tick.'},
  warlord:     {name:'Warlord',       icon:'👑',  maxHp:65,  atk:22, range:1, spd:2, special:'warlord',      desc:'All your pieces gain +6 attack while alive.'},
};

// ═══════════════════════════════════════════════════════
//  CONSTANTS
// ═══════════════════════════════════════════════════════
const BSIZE           = 8;
const CELL            = 70;       // cell pixel size
const PIECES_PER_SIDE = 10;
const RED_ROWS        = [0, 4];   // rows 0-3 inclusive
const BLUE_ROWS       = [4, 8];   // rows 4-7 inclusive
const RED_BACK        = 0;        // fortress wall row for red
const BLUE_BACK       = 7;        // fortress wall row for blue
const CTR_TOP         = 3;        // last red row (gets bottom border)
const CTR_BOT         = 4;        // first blue row (gets top border)
let TICK_MS           = 600;

// ═══════════════════════════════════════════════════════
//  GAME STATE
// ═══════════════════════════════════════════════════════
let G = {}, PID = 0, battleTimer = null, setupTimer = null;
let flashMap = {}, tickNum = 0;

function mkPiece(type, owner) {
  const d = PDEFS[type];
  return { id:++PID, type, owner,
    hp:d.maxHp, maxHp:d.maxHp, atk:d.atk, atkBonus:0,
    range:d.range, spd:d.spd, special:d.special,
    cooldown:0, status:{burn:0,poison:0} };
}

function initGame() {
  if (battleTimer) { clearInterval(battleTimer); battleTimer = null; }
  if (setupTimer)  { clearTimeout(setupTimer);   setupTimer  = null; }
  PID = 0; flashMap = {}; tickNum = 0;
  G = {
    board:  Array.from({length:BSIZE}, ()=>Array(BSIZE).fill(null)),
    phase:  'setup',
    maxHP:  [0, 0],
    kills:  [0, 0],
    trails: [],          // {fr,fc,tr,tc,owner,life,maxLife}
  };
  clearLog();
  document.getElementById('overlay').classList.remove('show');
  showControls('setup');
  document.getElementById('phase-banner').textContent = '🤖 AI Building Base...';
  render();
  animateSetup();
}

// ═══════════════════════════════════════════════════════
//  ANIMATED SETUP PHASE
// ═══════════════════════════════════════════════════════
function animateSetup() {
  const types = Object.keys(PDEFS);

  // ── Each team independently picks symmetric layouts within its own half ──
  // Layout:  4 symmetric column pairs on the front row + 1 ranged support pair
  //   front  pairs: (0,7) (1,6) (2,5) (3,4)  — 8 pieces
  //   support pair: (2,5)                     — 2 pieces
  // Red  occupies rows 2–3;  Blue occupies rows 5–4  (vertically mirrored).
  // Each team shuffles melee/ranged pools independently so their rosters differ.

  function buildPlacements(owner) {
    const frontRow   = owner === 0 ? 3 : BSIZE - 1 - 3;  // row 3 (Red) or row 4 (Blue)
    const supportRow = owner === 0 ? 2 : BSIZE - 1 - 2;  // row 2 (Red) or row 5 (Blue)

    const meleePool  = shuffle(types.filter(t => PDEFS[t].range === 1));
    const rangedPool = shuffle(types.filter(t => PDEFS[t].range >  1));

    const pairs  = [[0,7],[1,6],[2,5],[3,4]];
    const result = [];
    pairs.forEach((pair, pi) => {
      const type = meleePool[pi % meleePool.length];
      pair.forEach(c => result.push({ r: frontRow, c, type, owner }));
    });
    // Support pair — pick a different ranged type for visual variety
    const supportType = rangedPool[0];
    [2, 5].forEach(c => result.push({ r: supportRow, c, type: supportType, owner }));
    return result;
  }

  // Interleave Red and Blue placements so both sides animate simultaneously
  const redList  = buildPlacements(0);
  const blueList = buildPlacements(1);
  const combined = [];
  const maxLen = Math.max(redList.length, blueList.length);
  for (let k = 0; k < maxLen; k++) {
    if (k < redList.length)  combined.push(redList[k]);
    if (k < blueList.length) combined.push(blueList[k]);
  }

  let i = 0;
  const newPieceIds = new Set();

  function step() {
    if (i >= combined.length) {
      G.maxHP[0] = living(0).reduce((s,x)=>s+x.p.maxHp, 0);
      G.maxHP[1] = living(1).reduce((s,x)=>s+x.p.maxHp, 0);
      renderHUD();
      document.getElementById('phase-banner').textContent = '✅ Bases Ready — Battle starts!';
      showControls('ready');
      logS('🏰 Both bases built! ⚔️ Battle starts automatically!');
      render();
      // Auto-start the battle after a short pause so the player can see the setup
      setupTimer = setTimeout(() => startBattle(), 1800);
      return;
    }
    const {r, c, type, owner} = combined[i];
    if (!G.board[r][c]) {
      G.board[r][c] = mkPiece(type, owner);
      newPieceIds.add(G.board[r][c].id);
    }
    document.getElementById('phase-banner').textContent =
      `🤖 AI Building Bases... ${Math.floor(i/2)+1} / ${combined.length/2}`;
    renderBoard(newPieceIds);
    renderLines();
    i++;
    setupTimer = setTimeout(step, 100);
  }
  step();
}

// ═══════════════════════════════════════════════════════
//  BATTLE
// ═══════════════════════════════════════════════════════
function startBattle() {
  if (G.phase !== 'setup') return;
  G.phase = 'battle';
  showControls('battle');
  logS('⚔️ BATTLE BEGINS! ⚔️');
  render();
  battleTimer = setInterval(battleTick, TICK_MS);
}

function battleTick() {
  if (G.phase !== 'battle') return;
  tickNum++;
  document.getElementById('tick-count').textContent = 'Tick ' + tickNum;
  flashMap = {};

  // Decay trails
  G.trails = G.trails.map(t=>({...t,life:t.life-1})).filter(t=>t.life>0);

  // 1. Status damage
  allPieces().forEach(({p})=>{
    if(p.hp<=0) return;
    if(p.status.burn>0)   {p.hp=Math.max(0,p.hp-3);p.status.burn--;  flashMap[p.id]='hit';}
    if(p.status.poison>0) {p.hp=Math.max(0,p.hp-4);p.status.poison--;flashMap[p.id]='hit';}
  });

  // 2. Passive bonuses
  allPieces().forEach(({p})=>{p.atkBonus=0;});
  allPieces().forEach(({p})=>{
    if(p.hp>0&&p.special==='warlord') living(p.owner).forEach(({p:a})=>{a.atkBonus+=6;});
  });
  allPieces().forEach(({p,r,c})=>{
    if(p.hp>0&&p.special==='buff'){
      for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++){
        if(!dr&&!dc) continue;
        const n=bget(r+dr,c+dc);
        if(n&&n.owner===p.owner&&n.hp>0) n.atkBonus+=10;
      }
    }
  });

  // 3. Cooldowns tick down
  allPieces().forEach(({p})=>{if(p.cooldown>0)p.cooldown--;});

  // 4. Each piece fires — NO MOVEMENT
  shuffle(allPieces().filter(x=>x.p.hp>0)).forEach(({p,r,c})=>{
    if(p.hp<=0) return;
    if(p.special==='heal')   {actHealer(p,r,c);return;}
    if(p.special==='cleave') {actCleave(p,r,c);return;}

    const enemies=enemiesInRange(p,r,c);
    if(enemies.length>0&&p.cooldown<=0){
      const tgt=enemies[0];
      doAttack(p,r,c,tgt.p,tgt.r,tgt.c);
      if(p.special==='double'&&p.hp>0){
        const t2=tgt.p.hp>0?tgt:(enemies[1]||null);
        if(t2) doAttack(p,r,c,t2.p,t2.r,t2.c);
      }
      if(p.special==='aoe'&&enemies.length>1)
        doAttack(p,r,c,enemies[1].p,enemies[1].r,enemies[1].c);
      p.cooldown=p.spd; flashMap[p.id]='atk';
    }
    // (no else-move — pieces are stationary)
  });

  allPieces().forEach(({p})=>{p.atkBonus=0;});
  removeDead();

  const rc=living(0).length, bc=living(1).length;
  if(rc===0&&bc===0){endBattle('🤝 Draw!','Both bases fell simultaneously!');return;}
  if(rc===0)        {endBattle('🔵 Blue Wins!','Red base wiped out!');        return;}
  if(bc===0)        {endBattle('🔴 Red Wins!', 'Blue base wiped out!');       return;}
  render();
}

// ═══════════════════════════════════════════════════════
//  COMBAT HELPERS
// ═══════════════════════════════════════════════════════
function doAttack(atk,ar,ac,tgt,tr,tc){
  if(!tgt||tgt.hp<=0) return;
  if(tgt.special==='rangedImmune'&&chebyshev(ar,ac,tr,tc)>1){
    logR(atk,` -> ${pn(tgt)} IMMUNE to ranged!`); return;
  }
  let dmg=Math.max(1,atk.atk+atk.atkBonus);
  if(tgt.special==='armor'&&atk.special!=='bypass') dmg=Math.max(1,dmg>>1);
  tgt.hp=Math.max(0,tgt.hp-dmg);
  flashMap[tgt.id]='hit';
  logR(atk,` hits ${pn(tgt)} for ${dmg}`);
  // Spawn attack trail — longer life for long-range shots
  const dist = chebyshev(ar,ac,tr,tc);
  G.trails.push({fr:ar,fc:ac,tr,tc,owner:atk.owner,life:Math.max(5,dist+3),maxLife:Math.max(5,dist+3),type:atk.special||'melee'});
  if(tgt.special==='counter'&&tgt.hp>0&&atk.hp>0){
    const cd=Math.max(1,dmg*0.4|0);
    atk.hp=Math.max(0,atk.hp-cd);flashMap[atk.id]='hit';
    logS(`${pn(tgt)} counters ${pn(atk)} for ${cd}!`);
    G.trails.push({fr:tr,fc:tc,tr:ar,tc:ac,owner:tgt.owner,life:4,maxLife:4,type:'counter'});
  }
  if(atk.special==='burn'  &&tgt.hp>0&&tgt.status.burn  ===0){tgt.status.burn  =4;logS(`${pn(tgt)} is burning! 🔥`);}
  if(atk.special==='poison'&&tgt.hp>0&&tgt.status.poison===0){tgt.status.poison=4;logS(`${pn(tgt)} is poisoned! 🟢`);}
}

function actHealer(p,r,c){
  if(p.cooldown>0) return;
  const inj=living(p.owner)
    .filter(x=>x.p.id!==p.id&&x.p.hp<x.p.maxHp&&chebyshev(r,c,x.r,x.c)<=p.range)
    .sort((a,b)=>a.p.hp-b.p.hp);
  if(inj.length>0){
    inj[0].p.hp=Math.min(inj[0].p.maxHp,inj[0].p.hp+20);
    logS(`💚 ${pn(p)} heals ${pn(inj[0].p)} for 20 HP!`);
    flashMap[inj[0].p.id]='atk'; p.cooldown=p.spd;
    G.trails.push({fr:r,fc:c,tr:inj[0].r,tc:inj[0].c,owner:p.owner,life:4,maxLife:4,type:'heal'});
  }
}

function actCleave(p,r,c){
  const enemies=enemiesInRange(p,r,c);
  if(enemies.length>0&&p.cooldown<=0){
    enemies.forEach(e=>doAttack(p,r,c,e.p,e.r,e.c));
    p.cooldown=p.spd; flashMap[p.id]='atk';
  }
}

// ═══════════════════════════════════════════════════════
//  BOARD UTILITIES
// ═══════════════════════════════════════════════════════
function bget(r,c){return(r>=0&&r<BSIZE&&c>=0&&c<BSIZE)?G.board[r][c]:null;}
function chebyshev(r1,c1,r2,c2){return Math.max(Math.abs(r1-r2),Math.abs(c1-c2));}
function allPieces(){
  const out=[];
  for(let r=0;r<BSIZE;r++) for(let c=0;c<BSIZE;c++) if(G.board[r][c]) out.push({p:G.board[r][c],r,c});
  return out;
}
function living(owner){return allPieces().filter(x=>x.p.owner===owner&&x.p.hp>0);}
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=0|Math.random()*(i+1);[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function enemiesInRange(piece,r,c){
  return allPieces()
    .filter(x=>x.p.owner!==piece.owner&&x.p.hp>0&&chebyshev(r,c,x.r,x.c)<=piece.range)
    .sort((a,b)=>{
      const da=chebyshev(r,c,a.r,a.c),db=chebyshev(r,c,b.r,b.c);
      return da!==db?da-db:a.p.hp-b.p.hp;
    });
}
function findPos(id){
  for(let r=0;r<BSIZE;r++) for(let c=0;c<BSIZE;c++)
    if(G.board[r][c]&&G.board[r][c].id===id) return {r,c};
  return null;
}
function removeDead(){
  for(let r=0;r<BSIZE;r++) for(let c=0;c<BSIZE;c++){
    const p=G.board[r][c];
    if(p&&p.hp<=0){logS(`💀 ${pn(p)} falls!`);G.kills[p.owner===0?1:0]++;G.board[r][c]=null;}
  }
}
function endBattle(winText,subText){
  clearInterval(battleTimer);battleTimer=null;
  G.phase='gameover'; render();
  setTimeout(()=>{
    document.getElementById('win-text').textContent=winText;
    document.getElementById('win-sub').textContent =subText;
    document.getElementById('win-stats').innerHTML =
      `Ticks: ${tickNum}<br>🔴 Red kills: ${G.kills[0]} &nbsp;|&nbsp; 🔵 Blue kills: ${G.kills[1]}`;
    document.getElementById('overlay').classList.add('show');
  },500);
}
function setSpeed(ms,btn){
  TICK_MS=ms;
  if(battleTimer){clearInterval(battleTimer);battleTimer=setInterval(battleTick,TICK_MS);}
  document.querySelectorAll('.spd-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}

// ═══════════════════════════════════════════════════════
//  SHOW/HIDE CONTROLS BY PHASE
// ═══════════════════════════════════════════════════════
function showControls(phase){
  const show = (id, v) => { const e=document.getElementById(id); if(e) e.style.display=v?'':'none'; };
  show('btn-start',  phase==='ready');
  show('speed-label',phase==='battle');
  show('spd1',       phase==='battle');
  show('spd2',       phase==='battle');
  show('spd4',       phase==='battle');
  show('tick-count', phase==='battle');
}

// ═══════════════════════════════════════════════════════
//  RENDERING
// ═══════════════════════════════════════════════════════
function render(newIds){
  const banner=document.getElementById('phase-banner');
  if(G.phase==='battle')   banner.textContent='⚔️ Battle in Progress!';
  if(G.phase==='gameover') banner.textContent='🏆 Game Over';
  renderHUD();
  renderBoard(newIds);
  renderLines();
}

function renderHUD(){
  [0,1].forEach(owner=>{
    const id=owner===0?'red':'blue';
    const lv=living(owner);
    const cur=lv.reduce((s,x)=>s+x.p.hp,0);
    const max=G.maxHP[owner]||1;
    const pct=Math.max(0,(cur/max*100)|0);
    const col=pct>55?'#44dd44':pct>25?'#ddbb44':'#dd4444';
    document.getElementById(`hp-fill-${id}`).style.cssText=`width:${pct}%;background:${col}`;
    document.getElementById(`hp-text-${id}`).textContent=`${cur} / ${max} HP  (${pct}%)`;
    document.getElementById(`count-${id}`).textContent=`♟ ${lv.length}`;
  });
}

function renderBoard(newPieceIds){
  const boardEl=document.getElementById('board');
  boardEl.innerHTML='';
  for(let r=0;r<BSIZE;r++) for(let c=0;c<BSIZE;c++){
    const div=document.createElement('div');
    const dark=(r+c)%2===1;
    const inRed =r>=RED_ROWS[0] &&r<RED_ROWS[1];
    const inBlue=r>=BLUE_ROWS[0]&&r<BLUE_ROWS[1];
    const isBaseR=(r===RED_BACK);
    const isBaseB=(r===BLUE_BACK);
    div.className='cell '+(dark?'dark':'light')
      +(inRed ?' zr':'')+(inBlue?' zb':'')
      +(isBaseR?' base-r':'')+(isBaseB?' base-b':'')
      +(r===CTR_TOP?' ctr-top':'')+(r===CTR_BOT?' ctr-bottom':'');
    const p=G.board[r][c];
    if(p){
      const pel=document.createElement('div');
      const isNew=newPieceIds&&newPieceIds.has(p.id);
      pel.className='piece '+(p.owner===0?'red-pc':'blue-pc')+(isNew?' piece-enter':'');
      if(flashMap[p.id]==='atk') pel.classList.add('flash-atk');
      if(flashMap[p.id]==='hit') pel.classList.add('flash-hit');
      const def=PDEFS[p.type];
      const hp=(p.hp/p.maxHp*100)|0;
      const hc=hp>55?'#44dd44':hp>25?'#ddbb44':'#dd4444';
      let st='';
      if(p.status.burn>0)   st+='🔥';
      if(p.status.poison>0) st+='🟢';
      pel.innerHTML=(st?`<div class="status-dot">${st}</div>`:'')
        +`<div class="piece-icon">${def.icon}</div>`
        +`<div class="piece-lbl">${def.name}</div>`
        +`<div class="hp-bar"><div class="hp-fill" style="width:${hp}%;background:${hc}"></div></div>`;
      pel.addEventListener('mouseenter',()=>showInfo(p.type,p));
      div.appendChild(pel);
    }
    boardEl.appendChild(div);
  }
}

// ─── SVG: alliance connection lines + attack trails ────
function renderLines(){
  const svg=document.getElementById('lines-svg');
  // Clear everything except <defs>
  while(svg.lastChild && svg.lastChild.tagName!=='defs') svg.removeChild(svg.lastChild);

  const cx=c=>c*CELL+CELL/2;
  const cy=r=>r*CELL+CELL/2;

  // ── Alliance connection lines (adjacent same-team pieces) ────────────
  const pieces=allPieces();
  for(let i=0;i<pieces.length;i++){
    for(let j=i+1;j<pieces.length;j++){
      const a=pieces[i],b=pieces[j];
      if(a.p.owner===b.p.owner && chebyshev(a.r,a.c,b.r,b.c)===1){
        const ln=document.createElementNS('http://www.w3.org/2000/svg','line');
        ln.setAttribute('x1',cx(a.c)); ln.setAttribute('y1',cy(a.r));
        ln.setAttribute('x2',cx(b.c)); ln.setAttribute('y2',cy(b.r));
        const col=a.p.owner===0?'rgba(255,150,80,0.38)':'rgba(80,160,255,0.38)';
        ln.setAttribute('stroke',col);
        ln.setAttribute('stroke-width','2');
        ln.setAttribute('stroke-dasharray','5 4');
        svg.appendChild(ln);
      }
    }
  }

  // ── Attack trails ────────────────────────────────────────────────────
  G.trails.forEach(t=>{
    const frac  = t.life / t.maxLife;   // 1.0 → 0
    const x1=cx(t.fc), y1=cy(t.fr), x2=cx(t.tc), y2=cy(t.tr);

    // Pick colour scheme by trail type
    let rgb, healTrail=false;
    if(t.type==='heal')          { rgb='80,255,120';  healTrail=true; }
    else if(t.owner===0)         { rgb='255,110,40'; }  // red army → orange-red
    else                         { rgb='60,160,255'; }  // blue army → sky blue
    const filter=t.owner===0?'url(#glow-r)':'url(#glow-b)';

    // 1. Main beam line
    const beam=document.createElementNS('http://www.w3.org/2000/svg','line');
    beam.setAttribute('x1',x1); beam.setAttribute('y1',y1);
    beam.setAttribute('x2',x2); beam.setAttribute('y2',y2);
    beam.setAttribute('stroke',`rgba(${rgb},${(frac*0.7).toFixed(2)})`);
    beam.setAttribute('stroke-width', (1+frac*4).toFixed(1));
    beam.setAttribute('stroke-linecap','round');
    beam.setAttribute('filter',filter);
    svg.appendChild(beam);

    // 2. Source muzzle-flash circle (visible when trail is fresh)
    if(frac > 0.5){
      const mf=document.createElementNS('http://www.w3.org/2000/svg','circle');
      mf.setAttribute('cx',x1); mf.setAttribute('cy',y1);
      mf.setAttribute('r', (3+(frac-0.5)*14).toFixed(1));
      mf.setAttribute('fill',`rgba(${rgb},${((frac-0.5)*1.4).toFixed(2)})`);
      mf.setAttribute('filter',filter);
      svg.appendChild(mf);
    }

    // 3. Moving projectile ball — travels from source to target based on remaining life
    //    At life=maxLife the ball is near the source; at life=1 it's at the target.
    const progress = 1 - frac;   // 0 (just fired) → ~1 (about to expire)
    const px = x1 + (x2-x1)*progress;
    const py = y1 + (y2-y1)*progress;
    const ball=document.createElementNS('http://www.w3.org/2000/svg','circle');
    ball.setAttribute('cx',px); ball.setAttribute('cy',py);
    const ballR = healTrail ? (4+frac*5).toFixed(1) : (5+frac*6).toFixed(1);
    ball.setAttribute('r', ballR);
    ball.setAttribute('fill',`rgba(${rgb},${Math.min(1,frac*1.5).toFixed(2)})`);
    ball.setAttribute('filter',filter);
    svg.appendChild(ball);

    // 4. Impact burst at target when trail is near-new (ball just arrived)
    if(frac > 0.7){
      const burst=document.createElementNS('http://www.w3.org/2000/svg','circle');
      burst.setAttribute('cx',x2); burst.setAttribute('cy',y2);
      burst.setAttribute('r', ((1-frac)*30).toFixed(1));   // expands outward
      burst.setAttribute('fill','none');
      burst.setAttribute('stroke',`rgba(${rgb},${(frac-0.7).toFixed(2)})`);
      burst.setAttribute('stroke-width','2');
      svg.appendChild(burst);
    }
    // Sustained impact dot
    const dot=document.createElementNS('http://www.w3.org/2000/svg','circle');
    dot.setAttribute('cx',x2); dot.setAttribute('cy',y2);
    dot.setAttribute('r', (3+frac*5).toFixed(1));
    dot.setAttribute('fill',`rgba(${rgb},${(frac*0.65).toFixed(2)})`);
    svg.appendChild(dot);
  });
}

// ─── Info panel ────────────────────────────────────────
function showInfo(type,p){
  const def=PDEFS[type];
  const box=document.getElementById('info-box');
  const hp=p?`${p.hp}/${p.maxHp}`:`${def.maxHp}`;
  const tag=def.special?`<div class="special-tag">✨ ${def.special}</div>`:'';
  box.innerHTML=
    `<div class="info-row"><span>${def.icon} <b>${def.name}</b></span><span>${p?(p.owner===0?'🔴':'��'):''}</span></div>`
   +`<div class="info-row"><span>HP</span><span>${hp}</span></div>`
   +`<div class="info-row"><span>Attack</span><span>${def.atk}</span></div>`
   +`<div class="info-row"><span>Range</span><span>${def.range} tile${def.range>1?'s':''}</span></div>`
   +`<div class="info-row"><span>Atk CD</span><span>${def.spd} tick${def.spd>1?'s':''}</span></div>`
   +tag+`<p class="info-desc">${def.desc}</p>`;
}
function renderLegend(){
  const grid=document.getElementById('legend-grid');
  Object.entries(PDEFS).forEach(([k,def])=>{
    const it=document.createElement('div');
    it.className='leg-item';
    it.innerHTML=`<div class="leg-icon">${def.icon}</div><div class="leg-name">${def.name}</div>`;
    it.title=`${def.name} | HP:${def.maxHp} ATK:${def.atk} Range:${def.range} | ${def.desc}`;
    it.addEventListener('mouseenter',()=>showInfo(k));
    grid.appendChild(it);
  });
}

// ─── Log ───────────────────────────────────────────────
function pn(p){return p?PDEFS[p.type].icon+'['+(p.owner===0?'R':'B')+']':'?';}
function logR(atk,msg){appendLog(pn(atk)+msg,atk.owner===0?'log-r':'log-b');}
function logS(msg){appendLog(msg,'log-s');}
function appendLog(text,cls){
  const el=document.getElementById('log-box');
  const d=document.createElement('div');
  d.textContent=text;if(cls)d.className=cls;
  el.appendChild(d);el.scrollTop=el.scrollHeight;
}
function clearLog(){document.getElementById('log-box').innerHTML='';}
function resetGame(){initGame();}
window.onload=()=>{renderLegend();initGame();};
</script>
